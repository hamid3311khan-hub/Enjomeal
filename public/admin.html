<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eat4Bite™ Admin</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    body{font-family:Arial; background:#f4f4f4; padding:20px;}
.top-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.card{background:white; padding:20px; border-radius:10px; margin-bottom:20px; box-shadow:0 2px 5px #ccc;}
    input, select, button, textarea{padding:10px; margin:5px; border-radius:5px; border:1px solid #ccc; width:calc(100% - 22px);}
    button{background:#ff6600; color:white; border:none; cursor:pointer;}
.grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px;}
.stat-card{background:#ff6600; color:white; text-align:center; padding:20px;}
.stat-card h2{margin:0; font-size:30px;}
.order,.rider-item,.owner-item{border:1px solid #ddd; padding:10px; margin:10px 0; border-radius:5px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;}
.btn-green{background:#25D366;}.btn-red{background:#dc3545;}.btn-blue{background:#007bff;}.btn-orange{background:orange;}.btn-warning{background:#ffc107; color:#000;}
.logout-btn{background:#6c757d; padding:8px 15px; width:auto;}
    small{color:#666; font-size:12px;}
canvas{background:white; padding:10px; border-radius:8px;}
.alert{padding:10px; background:#fff3cd; border-left:4px solid #ffc107; margin-top:10px; border-radius:5px;}
.badge{padding:3px 8px; border-radius:4px; color:white; font-size:12px;}
</style>
</head>
<body>

<div class="top-bar">
    <h1>🍴 Eat4Bite™ Admin Panel</h1>
    <div class="top-buttons">
        <button class="btn-warning" onclick="location.href='/admin-owners'">🏪 Approve Restaurants</button>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>
</div>

<div class="grid">
    <div class="card stat-card"><h3>Total Orders</h3><h2 id="totalOrders">0</h2></div>
    <div class="card stat-card" style="background:#007bff;"><h3>Total Customers</h3><h2 id="totalCustomers">0</h2></div>
    <div class="card stat-card" style="background:#28a745;"><h3>Today Revenue</h3><h2 id="todayRevenue">₹0</h2></div>
</div>

<div class="card">
    <h2>📈 Last 7 Days Sales Graph</h2>
    <canvas id="salesChart" height="100"></canvas>
</div>

<div class="card">
    <h2>📊 All Restaurants Sales Report</h2>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <select id="reportShop" style="width:200px;"><option value="all">All Restaurants</option></select>
        <input type="date" id="startDate"><input type="date" id="endDate">
    </div>
    <button class="btn-blue" onclick="getReport()">Get Report</button>
    <div id="reportResult" style="margin-top:15px;"></div>
</div>

<div class="card">
    <h2>🏍️ Rider Cash Management</h2>
    <div id="riderCashList">Loading...</div>
</div>

<div class="card">
    <h2>🏪 Restaurant Approvals</h2>
    <div id="pendingOwnersList">Loading...</div>
</div>

<div class="card">
    <h2>🏍️ Pending Rider Approvals</h2>
    <div id="pendingRidersList">Loading...</div>
</div>

<div class="card">
    <h2>📦 Orders - Manual Assign</h2>
    <div id="ordersList">Loading...</div>
</div>

<script src="/socket.io/socket.io.js"></script> <!-- ADD KIYA -->
<script>
const API = '';
const socket = io(); // ADD KIYA
let salesChart = null;
let allRiders = [];

const ADMIN_PASSWORD = 'admin123';
function checkLogin(){
    if(sessionStorage.getItem('adminLoggedIn')!== 'true'){
        let pass = prompt("🔒 Admin Login\nPassword daalo:");
        if(pass === ADMIN_PASSWORD){
          sessionStorage.setItem('adminLoggedIn', 'true');
          loadData(); // YE ADD KIYA
        }
        else { alert("Galat Password!"); window.location = '/'; }
    } else {
      loadData(); // YE ADD KIYA
    }
}
function logout(){ sessionStorage.clear(); alert("Logout ho gaye"); window.location = '/'; }

async function loadGraph(){ /* same as yours */ }

async function loadOwners(){ /* same as yours */ }

async function approveOwner(id){ await fetch(`${API}/api/admin/approve-restaurant/${id}`, {method:'PUT'}); alert('Restaurant Approved!'); loadData(); }

async function loadShopDropdown(){ /* same */ }

async function getReport(){ /* same */ }

async function loadRiderCash(){
    try{
        const res = await fetch(`${API}/api/admin/rider-cash`);
        const riders = await res.json();
        if(riders.length === 0){ document.getElementById('riderCashList').innerHTML = 'Abhi koi rider nahi hai'; return; }
        document.getElementById('riderCashList').innerHTML = riders.map(r => `
            <div class="rider-item">
                <div><b>${r.name}</b> - ${r.mobile} <br><small>Cash: ₹${r.pending_cash}</small></div>
                <button class="btn-green" onclick="markDeposited('${r.mobile}')">💰 Deposit Le Liya</button>
            </div>`).join('');
    }catch(err){ document.getElementById('riderCashList').innerHTML = 'Error'; }
}

async function markDeposited(mobile){
    await fetch(`${API}/api/admin/rider-deposit`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({mobile}) });
    alert('Deposit Marked!'); loadRiderCash();
}

async function assignRider(orderId, riderId){
    if(!riderId) return;
    const res = await fetch(`${API}/api/admin/assign-rider`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({orderId, riderId}) });
    const data = await res.json();
    alert(data.msg || 'Rider Assigned!'); loadData();
}

async function loadData(){
    try{
        await loadGraph(); await loadOwners(); await loadShopDropdown(); await loadRiderCash();

        const ridersRes = await fetch(`${API}/api/admin/approved-riders`);
        allRiders = await ridersRes.json();

        const pendingRiders = await fetch(`${API}/api/admin/pending-riders`).then(r=>r.json());
        document.getElementById('pendingRidersList').innerHTML = pendingRiders.length === 0? 'Koi pending rider nahi hai' :
        pendingRiders.map(r => `<div class="rider-item"><div><b>${r.name}</b> - ${r.mobile}</div><button class="btn-green" onclick="approveRider('${r._id}')">✅ Approve</button></div>`).join('');

        const orders = await fetch(`${API}/api/orders`).then(r=>r.json());
        const today = new Date().toISOString().split('T')[0];
        const todayOrders = orders.filter(o => o.createdAt.startsWith(today));
        const todayRev = todayOrders.reduce((a,b) => a + Number(b.item_total || 0), 0);
        document.getElementById('totalOrders').innerText = orders.length;
        document.getElementById('totalCustomers').innerText = [...new Set(orders.map(o=>o.phone))].length;
        document.getElementById('todayRevenue').innerText = '₹' + todayRev;

        let orderHtml = '';
        for(let o of orders){
            let assignDropdown = '';
            if(o.status === 'Pending' &&!o.riderId){
                assignDropdown = `<select onchange="assignRider('${o.trackId}', this.value)"><option value="">Assign Rider</option>${allRiders.map(r => `<option value="${r.mobile}">${r.name}</option>`).join('')}</select>`;
            } else if(o.riderId){ assignDropdown = `<small style="color:green;">Rider: ${o.riderName || o.riderId}</small>`; }

            orderHtml += `<div class="order"><div><b>${o.trackId}</b> - ${o.name} - ₹${o.total} <br><small>${o.phone}</small><br>${assignDropdown}</div><div><a href="/invoice?id=${o.trackId}" target="_blank" class="btn-orange">📄 Invoice</a></div></div>`;
        }
        document.getElementById('ordersList').innerHTML = orderHtml || 'No orders yet';
    }catch(err){
        console.log(err);
        alert("Error: Server se data nahi aa raha. F12 console dekho")
    }
}

async function approveRider(id){ await fetch(`${API}/api/admin/approve-rider/${id}`, {method:'PUT'}); alert('Rider Approved!'); loadData(); }

checkLogin();
</script>
</body>
</html>
