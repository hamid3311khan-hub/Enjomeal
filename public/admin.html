<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eat4Bite™ Admin</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial; background:#f4f4f4; padding:20px;}
.top-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.card{background:white; padding:20px; border-radius:10px; margin-bottom:20px; box-shadow:0 2px 5px #ccc;}
input, select, button{padding:10px; margin:5px; border-radius:5px; border:1px solid #ccc; width:calc(100% - 22px);}
button{background:#ff6600; color:white; border:none; cursor:pointer;} button:hover{opacity:0.9;}
.grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px;}
.stat-card{background:#ff6600; color:white; text-align:center; padding:20px;}
.stat-card h2{margin:0; font-size:30px;}
.order,.rider-item{border:1px solid #ddd; padding:10px; margin:10px 0; border-radius:5px;}
.btn-green{background:#25D366;}.btn-blue{background:#007bff;}
.btn-warning{background:#ffc107; color:#000; text-decoration:none; padding:8px 15px; border-radius:5px; font-weight:600;}
.logout-btn{background:#6c757d; padding:8px 15px; width:auto;}
</style>
</head>
<body>

<div class="top-bar">
    <h1>🍴 Eat4Bite™ Admin Panel</h1>
    <div>
        <!-- LINK YAHAN CHANGE HAI -->
        <a href="/approve-restaurants" class="btn-warning">🏪 Approve Restaurants</a>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>
</div>

<div class="grid">
    <div class="card stat-card"><h3>Total Orders</h3><h2 id="totalOrders">0</h2></div>
    <div class="card stat-card" style="background:#007bff;"><h3>Total Customers</h3><h2 id="totalCustomers">0</h2></div>
    <div class="card stat-card" style="background:#28a745;"><h3>Today Revenue</h3><h2 id="todayRevenue">₹0</h2></div>
</div>

<div class="card"><h2>📈 Sales Graph</h2><canvas id="salesChart" height="100"></canvas></div>
<div class="card">
    <h2>📊 Sales Report</h2>
    <select id="reportShop"><option value="all">All Restaurants</option></select>
    <input type="date" id="startDate"><input type="date" id="endDate">
    <button class="btn-blue" onclick="getReport()">Get Report</button>
    <div id="reportResult"></div>
</div>
<div class="card"><h2>🏍️ Pending Riders</h2><div id="pendingRidersList">Loading...</div></div>
<div class="card"><h2>📦 Orders</h2><div id="ordersList">Loading...</div></div>
<div class="card"><h2>🏍️ Approved Riders</h2><div id="riderList">Loading...</div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const API=''; const ADMIN_PASSWORD='admin123'; let allRiders=[];
function checkLogin(){ if(sessionStorage.getItem('adminLoggedIn')!=='true'){ let pass=prompt("Password:"); if(pass===ADMIN_PASSWORD){sessionStorage.setItem('adminLoggedIn','true'); location.reload();} else {alert("Galat"); window.location.href='/';}} else loadData(); }
function logout(){sessionStorage.clear(); window.location.href='/';}
async function loadData(){
    const shops=await fetch(API+'/api/admin/restaurants').then(r=>r.json());
    document.getElementById('reportShop').innerHTML='<option value="all">All</option>'+shops.map(s=>`<option value="${s.restaurantId}">${s.restaurantName}</option>`).join('');
    
    const riders=await fetch(API+'/api/admin/approved-riders').then(r=>r.json());
    allRiders=riders; document.getElementById('riderList').innerHTML=riders.map(r=>`<div>${r.name} - ${r.mobile}</div>`).join('');
    
    const pending=await fetch(API+'/api/admin/pending-riders').then(r=>r.json());
    document.getElementById('pendingRidersList').innerHTML=pending.map(r=>`<div>${r.name} <button class="btn-green" onclick="approveRider('${r._id}')">Approve</button></div>`).join('');
    
    const orders=await fetch(API+'/api/orders').then(r=>r.json());
    document.getElementById('totalOrders').innerText=orders.length;
    document.getElementById('ordersList').innerHTML=orders.map(o=>`<div>${o.trackId} - ${o.name}</div>`).join('');
}
async function approveRider(id){await fetch(API+`/api/admin/approve-rider/${id}`,{method:'PUT'}); loadData();}
async function getReport(){alert('Report')}
checkLogin();
</script>
</body>
</html>
