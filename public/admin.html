<!DOCTYPE html>
<html>
<head><title>Restaurant Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar bg-dark text-white p-3">
  <span>Welcome, <b id="restName"></b></span>
  <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
</nav>
<div class="container mt-4">
  <h2>📊 Dashboard</h2>
  <div class="row">
    <div class="col-md-4"><div class="card p-3"><h6>Today Orders</h6><h3>0</h3></div></div>
    <div class="col-md-4"><div class="card p-3"><h6>Today Revenue</h6><h3>₹0</h3></div></div>
    <div class="col-md-4"><div class="card p-3"><a href="/restaurant-profile">Manage Menu</a></div></div>
  </div>
</div>
<script>
const restaurantId = localStorage.getItem('restaurantId');
if(!restaurantId){ window.location.href = '/restaurant-login'; }
document.getElementById('restName').innerText = localStorage.getItem('restaurantName');
function logout(){
  localStorage.removeItem('restaurantId');
  localStorage.removeItem('restaurantName');
  window.location.href = '/restaurant-login';
}
</script>
</body>
</html>
