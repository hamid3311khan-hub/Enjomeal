<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eat4Bite Admin Panel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial; background:#f4f4f4; padding:20px}
.box{background:#fff; padding:15px; margin:10px 0; border-radius:8px; box-shadow:0 2px 5px #ccc}
.btn{background:#28a745; color:#fff; border:none; padding:8px 15px; border-radius:5px; cursor:pointer}
.btn-red{background:#dc3545}
h2{color:#333; border-bottom:2px solid #ff5722; padding-bottom:5px}
img{width:100px; border-radius:5px}
</style>
</head>
<body>

<h1>🔥 Eat4Bite Admin Panel</h1>

<h2>1. Pending Restaurants</h2>
<div id="pendingRestaurants">Loading...</div>

<h2>2. Pending Riders</h2>
<div id="pendingRiders">Loading...</div>

<h2>3. Approved Restaurants - Payout</h2>
<div id="approvedRestaurants">Loading...</div>

<script>
const API = "/api";

// PAGE LOAD HOTE HI DATA LAO
loadData();

async function loadData(){
  // 1. PENDING RESTAURANT
  let res = await fetch(`${API}/admin/pending-restaurants`);
  let restaurants = await res.json();
  document.getElementById('pendingRestaurants').innerHTML = restaurants.length===0 ? "No pending" : restaurants.map(r => `
    <div class="box">
      <b>${r.restaurantName}</b> - ${r.ownerName}<br>
      Mobile: ${r.mobile} | Plan: ${r.plan_status}<br>
      <img src="${r.image}" /><br>
      <button class="btn" onclick="approveRestaurant('${r._id}')">Approve</button>
      <button class="btn btn-red" onclick="rejectRestaurant('${r._id}')">Reject</button>
    </div>
  `).join('');

  // 2. PENDING RIDER
  res = await fetch(`${API}/admin/pending-riders`);
  let riders = await res.json();
  document.getElementById('pendingRiders').innerHTML = riders.length===0 ? "No pending" : riders.map(r => `
    <div class="box">
      <b>${r.name}</b> - ${r.mobile}<br>
      Vehicle: ${r.vehicleNo}<br>
      DL: <img src="${r.dlProof}" /> Aadhar: <img src="${r.aadharImg}" /><br>
      <button class="btn" onclick="approveRider('${r._id}')">Approve</button>
    </div>
  `).join('');

  // 3. APPROVED RESTAURANT + PAYOUT
  res = await fetch(`${API}/admin/restaurants`);
  let approved = await res.json();
  document.getElementById('approvedRestaurants').innerHTML = approved.map(r => `
    <div class="box">
      <b>${r.restaurantName}</b><br>
      Payout Due: ₹${r.payout_due}<br>
      <button class="btn" onclick="payPayout('${r.restaurantId}', ${r.payout_due})">Pay Payout</button>
    </div>
  `).join('');
}

// FUNCTIONS
async function approveRestaurant(id){
  await fetch(`${API}/admin/approve-restaurant/${id}`, {method:'PUT'});
  alert("Restaurant Approved");
  loadData();
}

async function approveRider(id){
  await fetch(`${API}/admin/approve-rider/${id}`, {method:'PUT'});
  alert("Rider Approved");
  loadData();
}

async function payPayout(restaurantId, amount){
  if(confirm(`Pay ₹${amount} to ${restaurantId}?`)){
    // Yaha tu UPI/IMPS ka logic jodega. Abhi ke liye DB me 0 kar rahe
    await fetch(`${API}/admin/pay-payout`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({restaurantId, amount})
    });
    alert("Payout Marked as Paid");
    loadData();
  }
}
</script>
</body>
</html>
