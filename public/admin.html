<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Eat4Bite™ - Order Food in Barkagaon</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:#ff6600;color:#fff;padding:15px;text-align:center}
.rest-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;padding:15px}
.card{background:#fff;border-radius:10px;padding:10px;cursor:pointer;box-shadow:0 2px 5px #ccc}
.card img{width:100%;height:150px;object-fit:cover;border-radius:8px}
</style>
</head>
<body>
<div class="header"><h2>🍔 Eat4Bite™ Barkagaon</h2></div>
<div id="restaurants" class="rest-grid">Loading...</div>
<script>
const API="/api";
fetch(`${API}/restaurants`).then(r=>r.json()).then(shops=>{
document.getElementById('restaurants').innerHTML=shops.map(s=>`
<div class="card" onclick="location.href='/menu.html?id=${s._id}'">
<img src="${s.image || 'https://via.placeholder.com/300'}">
<h3>${s.restaurantName}</h3><p>${s.address}</p>
</div>`).join('')
})
</script>
</body></html>
