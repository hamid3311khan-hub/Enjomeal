async function loadShopDropdown(){
    const shops = await safeFetch(`${API}/api/admin/restaurants`);
    if(!shops) return;
    const select = document.getElementById('reportShop');
    select.innerHTML = `<option value="all">All Restaurants</option>`;
    shops.forEach(s => { select.innerHTML += `<option value="${s.restaurantId}">${s.restaurantName}</option>`; }); // FIX: s._id -> s.restaurantId
}

async function loadData(){ /* same */ }

async function assignRider(orderId, riderId){ if(!riderId) return; const res = await fetch(`${API}/api/admin/assign-rider`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({orderId, riderId}) }); const data = await res.json(); alert(data.success? 'Rider Assigned!' : data.error); loadData(); }
async function approveRider(id){ await fetch(`${API}/api/admin/approve-rider/${id}`, {method:'PUT'}); alert('Rider Approved!'); loadData(); }

async function getReport(){
    const shop = document.getElementById('reportShop').value;
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    if(!start ||!end) return alert("Start aur End date select karo");
    const res = await fetch(`${API}/api/report?startDate=${start}&endDate=${end}&restaurantId=${shop}`); // FIX: param name
    const data = await res.json();
    document.getElementById('reportResult').innerHTML = `
        <h3>Report Result</h3>
        <p><b>Total Orders:</b> ${data.length}</p>
        <p><b>Total Revenue:</b> ₹${data.reduce((a,b)=>a+b.grand_total,0)}</p>
    `;
}

document.getElementById('bannerImage').addEventListener('change', function(e){ /* same */ });
document.getElementById('bannerForm').addEventListener('submit', async(e)=>{
    e.preventDefault();
    const fd = new FormData();
    fd.append('text', document.getElementById('bannerText').value);
    fd.append('color', document.getElementById('bannerColor').value);
    const file = document.getElementById('bannerImage').files[0];
    if(file) fd.append('image', file); // FIX: bannerImage -> image
    const res = await fetch(`${API}/api/admin/promo`, {method:'POST', body:fd}); // FIX
    const data = await res.json();
    alert(data.success? '✅ Banner Save ho gaya!' : 'Error');
    loadBanner();
});
document.getElementById('deleteBanner').addEventListener('click', async()=>{ if(confirm('Banner delete kare?')){ const res = await fetch(`${API}/api/admin/promo`, {method:'DELETE'}); const data = await res.json(); alert(data.success? '✅ Banner Delete ho gaya!' : 'Error'); document.getElementById('bannerPreview').style.display = 'none'; document.getElementById('bannerImage').value = ''; } });
