<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eat4Bite™ Admin</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    body{font-family:Arial; background:#f4f4f4; padding:20px;}
.top-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.top-buttons a{padding:10px 15px; border-radius:5px; text-decoration:none; color:white; margin-left:10px; font-weight:bold;}
.btn-admin{background:#333;}.btn-owner{background:orange;}
.card{background:white; padding:20px; border-radius:10px; margin-bottom:20px; box-shadow:0 2px 5px #ccc;}
    input, select, button, textarea{padding:10px; margin:5px; border-radius:5px; border:1px solid #ccc; width:calc(100% - 22px);}
    button{background:#ff6600; color:white; border:none; cursor:pointer;}
    button:hover{opacity:0.9;}
.grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px;}
.stat-card{background:#ff6600; color:white; text-align:center; padding:20px;}
.stat-card h2{margin:0; font-size:30px;}
.order,.menu-item,.rider-item,.owner-item{border:1px solid #ddd; padding:10px; margin:10px 0; border-radius:5px;}
.btn-green{background:#25D366;}.btn-red{background:#dc3545;}.btn-blue{background:#007bff;}.btn-orange{background:orange;}
.report-result p{margin:5px 0; font-size:16px;}
.logout-btn{background:#6c757d; padding:8px 15px; width:auto;}
    small{color:#666; font-size:12px;}
.rider-docs img{width:70px; height:70px; object-fit:cover; border:1px solid #ccc; border-radius:5px; margin:3px;}
.menu-item img{width:80px; height:80px; object-fit:cover; border-radius:5px; float:left; margin-right:10px;}
canvas{background:white; padding:10px; border-radius:8px;}
</style>
</head>
<body>

<div class="top-bar">
    <h1>🍴 Eat4Bite™ Admin Panel</h1>
    <div class="top-buttons">
        <a href="/admin-owners" class="btn-owner">🏪 Approve Restaurants</a>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>
</div>

<div class="grid">
    <div class="card stat-card"><h3>Total Orders</h3><h2 id="totalOrders">0</h2></div>
    <div class="card stat-card" style="background:#007bff;"><h3>Total Customers</h3><h2 id="totalCustomers">0</h2></div>
    <div class="card stat-card" style="background:#28a745;"><h3>Today Revenue</h3><h2 id="todayRevenue">₹0</h2></div>
</div>

<div class="card">
    <h2>📈 Last 7 Days Sales Graph</h2>
    <canvas id="salesChart" height="100"></canvas>
</div>

<div class="card">
    <h2>🏪 Pending Restaurant Approvals</h2>
    <div id="pendingOwnersList">Loading...</div>
</div>

<div class="card">
    <h2>🏍️ Pending Rider Approvals</h2>
    <div id="pendingRidersList">Loading...</div>
</div>

<div class="card">
    <h2>📦 Orders</h2>
    <div id="ordersList">Loading...</div>
</div>

<script>
const API = ''; // Render pe same domain hai
let salesChart = null;

const ADMIN_PASSWORD = 'admin123';
function checkLogin(){
    if(sessionStorage.getItem('adminLoggedIn')!== 'true'){
        let pass = prompt("🔒 Admin Login\nPassword daalo:");
        if(pass === ADMIN_PASSWORD){ sessionStorage.setItem('adminLoggedIn', 'true'); }
        else { alert("Galat Password!"); window.location = '/'; }
    }
}
function logout(){ sessionStorage.removeItem('adminLoggedIn'); alert("Logout ho gaye"); window.location = '/'; }
checkLogin();

async function loadGraph(){
    try{
        const res = await fetch(`${API}/api/admin/graph`);
        const data = await res.json();
        const labels = data.map(d => d.date);
        const revenue = data.map(d => d.revenue);
        const orders = data.map(d => d.orders);
        const ctx = document.getElementById('salesChart').getContext('2d');
        if(salesChart) salesChart.destroy();
        salesChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: labels, datasets: [
                {label: 'Revenue ₹', data: revenue, backgroundColor: '#ff6600'},
                {label: 'Orders', data: orders, backgroundColor: '#007bff', type: 'line', yAxisID: 'y1'}
            ]},
            options: { responsive: true, scales: { y: {beginAtZero: true}, y1: {beginAtZero: true, position: 'right'} } }
        });
    }catch(e){ console.log("Graph error", e) }
}

async function loadOwners(){
    const res = await fetch(`${API}/api/admin/pending-restaurants`); // ✅ FIXED
    const owners = await res.json();
    document.getElementById('pendingOwnersList').innerHTML = owners.length === 0? 'Koi pending restaurant nahi hai' :
    owners.map(o => `
        <div class="owner-item">
            <b>${o.restaurantName}</b> - ${o.ownerName} <br>
            <small>ID: ${o.restaurantId} | Mobile: ${o.mobile}</small> <br>
            <button class="btn-green" onclick="approveOwner('${o._id}')">✅ Approve</button>
        </div>
    `).join('');
}

async function approveOwner(id){
    await fetch(`${API}/api/admin/approve-restaurant/${id}`, {method:'PUT'}); // ✅ FIXED
    alert('Restaurant Approved!');
    loadData();
}

async function loadData(){
    await loadGraph();
    await loadOwners();

    const pendingRiders = await fetch(`${API}/api/admin/pending-riders`).then(r=>r.json()); // ✅ FIXED
    document.getElementById('pendingRidersList').innerHTML = pendingRiders.length === 0? 'Koi pending rider nahi hai' :
    pendingRiders.map(r => `
        <div class="rider-item">
            <b>${r.name}</b> - ${r.mobile} <br>
            <button class="btn-green" onclick="approveRider('${r._id}')">✅ Approve Karo</button>
        </div>
    `).join('');

    const orders = await fetch(`${API}/api/orders`).then(r=>r.json());
    const today = new Date().toISOString().split('T')[0];
    const todayOrders = orders.filter(o => o.createdAt.startsWith(today));
    const todayRev = todayOrders.reduce((a,b) => a + Number(b.item_total), 0);
    document.getElementById('totalOrders').innerText = orders.length;
    document.getElementById('totalCustomers').innerText = [...new Set(orders.map(o=>o.phone))].length;
    document.getElementById('todayRevenue').innerText = '₹' + todayRev;

    let orderHtml = '';
    for(let o of orders){
        orderHtml += `
            <div class="order">
                <b>${o.trackId}</b> - ${o.name} - ₹${o.total} <br>
                <small>${o.phone} | ${o.address} | Status: ${o.status}</small> <br>
                <a href="/invoice?id=${o.trackId}" target="_blank" class="btn-orange">📄 Invoice</a>
                <a href="/track?id=${o.trackId}" target="_blank" class="btn-blue">Track</a>
            </div>
        `;
    }
    document.getElementById('ordersList').innerHTML = orderHtml || 'No orders yet';
}

async function approveRider(id){
    await fetch(`${API}/api/admin/approve-rider/${id}`, {method:'PUT'}); // ✅ FIXED
    alert('Rider Approved!');
    loadData();
}

loadData();
</script>
</body>
</html>
