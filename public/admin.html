<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eat4Bite™ Admin</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    body{font-family:Arial; background:#f4f4f4; padding:20px;}
   .top-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
   .top-buttons button{padding:10px 15px; border-radius:5px; border:none; color:white; margin-left:10px; font-weight:bold; cursor:pointer;}
   .btn-admin{background:#333;}.btn-owner{background:orange;}
   .card{background:white; padding:20px; border-radius:10px; margin-bottom:20px; box-shadow:0 2px 5px #ccc;}
    input, select, button, textarea{padding:10px; margin:5px; border-radius:5px; border:1px solid #ccc; width:calc(100% - 22px);}
    button{background:#ff6600; color:white; border:none; cursor:pointer;}
    button:hover{opacity:0.9;}
   .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px;}
   .stat-card{background:#ff6600; color:white; text-align:center; padding:20px;}
   .stat-card h2{margin:0; font-size:30px;}
   .order,.rider-item{border:1px solid #ddd; padding:10px; margin:10px 0; border-radius:5px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
   .btn-green{background:#25D366;}.btn-red{background:#dc3545;}.btn-blue{background:#007bff;}.btn-orange{background:orange;}.btn-warning{background:#ffc107; color:#000;}
   .logout-btn{background:#6c757d; padding:8px 15px; width:auto;}
    small{color:#666; font-size:12px;}
    canvas{background:white; padding:10px; border-radius:8px;}
   .alert{padding:10px; background:#fff3cd; border-left:4px solid #ffc107; margin-top:10px; border-radius:5px;}
</style>
</head>
<body>

<div class="top-bar">
    <h1>🍴 Eat4Bite™ Admin Panel</h1>
    <div class="top-buttons">
        <button class="btn-warning" onclick="location.href='/admin-owners'">🏪 Approve Restaurants</button>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>
</div>

<div class="grid">
    <div class="card stat-card"><h3>Total Orders</h3><h2 id="totalOrders">0</h2></div>
    <div class="card stat-card" style="background:#007bff;"><h3>Total Customers</h3><h2 id="totalCustomers">0</h2></div>
    <div class="card stat-card" style="background:#28a745;"><h3>Today Revenue</h3><h2 id="todayRevenue">₹0</h2></div>
</div>

<div class="card">
    <h2>📈 Last 7 Days Sales Graph</h2>
    <canvas id="salesChart" height="100"></canvas>
</div>

<!-- PROMOTION BANNER - FILE UPLOAD -->
<div class="card">
    <h2>📢 Promotion Banner</h2>
    <p style="color:#666; font-size:13px;">Text ya Image dono daal sakte ho</p>
    <input type="text" id="promoText" placeholder="Text likho - Ex: 50% OFF - CODE: FIRST50">
    <label><b>Ya Image Upload Karo:</b></label>
    <input type="file" id="promoFile" accept="image/*">
    <input type="text" id="promoColor" placeholder="Background Color" value="#ff6600">
    <button class="btn-orange" onclick="updatePromo()">Update Banner</button>
    <button class="btn-red" onclick="removePromo()">Remove Banner</button>
    <div id="promoPreview" style="margin-top:10px;"></div>
</div>

<!-- ALL ORDERS WITH MANUAL ASSIGN -->
<div class="card">
    <h2>📦 All Orders - Manual Assign + Auto 5min</h2>
    <div id="ordersList">Loading...</div>
</div>

<!-- APPROVED RIDERS -->
<div class="card">
    <h2>🏍️ Approved Riders</h2>
    <div id="riderList">Loading...</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const API = '';
const socket = io();
let salesChart = null;
let allRiders = [];

const ADMIN_PASSWORD = 'admin123';
function checkLogin(){
    if(sessionStorage.getItem('adminLoggedIn')!== 'true'){
        let pass = prompt("🔒 Admin Login\nPassword daalo:");
        if(pass === ADMIN_PASSWORD){ sessionStorage.setItem('adminLoggedIn', 'true'); }
        else { alert("Galat Password!"); window.location.href = '/'; }
    }
}
function logout(){
    sessionStorage.clear();
    alert("Logout ho gaye");
    window.location.href = '/'; // FIXED
}
checkLogin();

async function loadGraph(){
    try{
        const res = await fetch(`${API}/api/admin/graph`);
        const data = await res.json();
        const labels = data.map(d => d.date);
        const revenue = data.map(d => d.revenue);
        const orders = data.map(d => d.orders);
        const ctx = document.getElementById('salesChart').getContext('2d');
        if(salesChart) salesChart.destroy();
        salesChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: labels, datasets: [
                {label: 'Revenue ₹', data: revenue, backgroundColor: '#ff6600'},
                {label: 'Orders', data: orders, backgroundColor: '#007bff', type: 'line', yAxisID: 'y1'}
            ]},
            options: { responsive: true, scales: { y: {beginAtZero: true}, y1: {beginAtZero: true, position: 'right'} } }
        });
    }catch(e){ console.log("Graph error", e) }
}

// PROMO FUNCTIONS
async function loadPromo(){
    try{
        const res = await fetch(`${API}/api/promo`);
        const promo = await res.json();
        if(promo) showPromoPreview(promo);
    }catch(e){}
}
async function updatePromo(){
    const fileInput = document.getElementById('promoFile');
    let imageBase64 = '';
    if(fileInput.files[0]){
        imageBase64 = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.readAsDataURL(fileInput.files[0]);
        });
    }
    const promo = {
        text: document.getElementById('promoText').value,
        image: imageBase64,
        color: document.getElementById('promoColor').value
    }
    await fetch(`${API}/api/admin/promo`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(promo)});
    alert('Banner Updated!');
    showPromoPreview(promo);
    fileInput.value = '';
}
async function removePromo(){
    await fetch(`${API}/api/admin/promo`, {method:'DELETE'});
    alert('Banner Removed!');
    document.getElementById('promoPreview').innerHTML = '';
    document.getElementById('promoText').value = '';
    document.getElementById('promoColor').value = '#ff6600';
    document.getElementById('promoFile').value = '';
}
function showPromoPreview(promo){
    let html = `<div style="background:${promo.color}; color:white; padding:10px; text-align:center; border-radius:8px;">`;
    if(promo.image) html += `<img src="${promo.image}" style="width:100%; max-height:150px; object-fit:cover; border-radius:5px;">`;
    if(promo.text) html += `<p style="margin:5px 0; font-weight:bold;">${promo.text}</p>`;
    html += `</div>`;
    document.getElementById('promoPreview').innerHTML = html;
}

// MANUAL ASSIGN FUNCTION
async function assignRider(orderId, riderId){
    if(!riderId) return;
    const res = await fetch(`${API}/api/admin/assign-rider`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({orderId, riderId})
    });
    const data = await res.json();
    alert(data.error || 'Rider Assigned!');
    loadData();
}

async function loadData(){
    await loadGraph();
    await loadPromo();

    const ridersRes = await fetch(`${API}/api/admin/approved-riders`);
    allRiders = await ridersRes.json();
    document.getElementById('riderList').
