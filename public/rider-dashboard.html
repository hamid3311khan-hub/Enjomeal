<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><title>Rider Dashboard</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{background:#f5f5f5}.card{background:#fff;padding:15px;margin:10px;border-radius:8px}</style></head><body>
<h2>🚚 My Delivery Orders</h2><button onclick="toggleGPS()" id="gpsBtn">Start Auto GPS</button><div id="orders"></div>
<script>
const API="/api"; const rider=JSON.parse(localStorage.getItem('rider')); let gpsInterval;
setInterval(loadOrders,3000); loadOrders();

function loadOrders(){fetch(`${API}/orders/available`).then(r=>r.json()).then(data=>{
document.getElementById('orders').innerHTML=data.map(o=>`
<div class="card"><h3>${o.trackId}</h3><p>${o.address}</p><p>₹${o.grand_total}</p>
<button onclick="accept('${o._id}')">Accept</button><button onclick="delivered('${o._id}')">Delivered</button></div>`).join('')})}

function toggleGPS(){ if(gpsInterval){clearInterval(gpsInterval); gpsBtn.innerText="Start Auto GPS"} else {gpsInterval=setInterval(sendLoc,5000); gpsBtn.innerText="Stop Auto GPS"} }
function sendLoc(){ navigator.geolocation.getCurrentPosition(pos=>{fetch(`${API}/rider/update-location`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({riderId:rider._id,lat:pos.coords.latitude,lng:pos.coords.longitude})})}
function accept(id){fetch(`${API}/rider/accept-order`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:id,riderId:rider._id,riderName:rider.name})})}
function delivered(id){fetch(`${API}/order/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:id,status:'delivered'})})}
</script></body></html>
