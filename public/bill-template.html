<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><title>Bill</title><style>body{font-family:'Courier New';max-width:400px;margin:auto}.center{text-align:center}.line{border-top:1px dashed #000}</style></head><body onload="window.print()">
<div class="center"><h2>🍔 Eat4Bite™</h2><p>Barkagaon<br>Ph: 62000-12345</p></div><div class="line"></div>
<p><b>Order:</b> <span id="trackId"></span><br><b>Restaurant:</b> <span id="rest"></span></p><div id="items"></div><div class="line"></div>
<p><b>TOTAL: ₹<span id="total"></span></b></p><div class="line"></div><p class="center">Thank You! 🙏</p>
<script>
const trackId=new URLSearchParams(location.search).get('trackId'); document.getElementById('trackId').innerText=trackId;
fetch(`/api/track/${trackId}`).then(r=>r.json()).then(o=>{
document.getElementById('rest').innerText=o.restaurantName; document.getElementById('total').innerText=o.grand_total;
document.getElementById('items').innerHTML=o.items.map(i=>`<p>${i.name}......₹${i.price}</p>`).join('');
});
</script></body></html>
