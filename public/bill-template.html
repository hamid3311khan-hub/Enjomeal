<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Bill - Eat4Bite™</title>
<style>/* same */</style></head><body>
<!-- same body -->

<script>
const API = window.location.origin; // FIX
const params = new URLSearchParams(window.location.search); const orderId = params.get('id');
async function loadBill(){
    const res = await fetch(`${API}/api/orders/track/${orderId}`); // FIX: route
    const order = await res.json();
    document.getElementById('orderId').innerText = order.trackId;
    document.getElementById('orderDate').innerText = new Date(order.createdAt).toLocaleString();
    document.getElementById('paymentMode').innerText = order.paymentMode; // FIX
    document.getElementById('riderId').innerText = order.riderName || 'N/A';
    let itemsHTML = ''; order.items.forEach(i=>{ itemsHTML += `<div class="row"><span>${i.name} x ${i.qty}</span> <span>₹${i.price * i.qty}</span></div>`; });
    document.getElementById('itemList').innerHTML = itemsHTML;
    document.getElementById('subTotal').innerText = order.item_total;
    document.getElementById('gst').innerText = order.commission_5;
    document.getElementById('delivery').innerText = order.delivery_fee;
    document.getElementById('platform').innerText = order.platform_fee;
    document.getElementById('grandTotal').innerText = order.grand_total; // FIX
}
function downloadPDF(){ window.location.href = `${API}/invoice/${orderId}`; } // FIX
loadBill();
</script></body></html>
