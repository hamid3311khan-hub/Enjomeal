<!DOCTYPE html>
<html>
<head>
  <title>Admin - QuickBite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="navbar">
    <a href="/admin">📊 Dashboard</a>
    <a href="/admin/admin-orders.html">📦 Orders</a>
    <a href="/admin/admin-restaurants.html">🏪 Restaurants</a>
    <a href="/admin/admin-payout.html">💰 Payout</a>
  </div>
  
  <h2 style="padding:15px">Admin Dashboard</h2>
  
  <!-- STATS CARDS -->
  <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:15px">
    <div class="card" style="text-align:center">
      <h4>Total Orders</h4>
      <h2 class="price">128</h2>
    </div>
    <div class="card" style="text-align:center">
      <h4>COD Orders</h4>
      <h2>84</h2>
    </div>
    <div class="card" style="text-align:center">
      <h4>UPI Paid</h4>
      <h2>44</h2>
    </div>
    <div class="card" style="text-align:center">
      <h4>Revenue</h4>
      <h2 class="price">₹24,560</h2>
    </div>
  </div>
  
  <!-- LATEST ORDERS -->
  <div class="card" style="margin:15px">
    <h3>🆕 Latest Orders</h3>
    <table style="width:100%; margin-top:10px">
      <tr style="background:#eee">
        <th style="padding:8px">Order ID</th>
        <th>Customer</th>
        <th>Amount</th>
        <th>Payment</th>
        <th>Status</th>
        <th>Proof</th>
      </tr>
      <tr>
        <td>#QB001</td>
        <td>Rahul</td>
        <td>₹204</td>
        <td>COD</td>
        <td>pending</td>
        <td>-</td>
      </tr>
      <tr>
        <td>#QB002</td>
        <td>Pooja</td>
        <td>₹350</td>
        <td>UPI</td>
        <td>paid</td>
        <td><a href="#" style="color:blue">View Screenshot</a></td>
      </tr>
    </table>
  </div>
</body>
</html>
