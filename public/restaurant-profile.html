<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Restaurant - Eat4Bite™</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body{background:#f8f9fa}
    .navbar{background:#ff6600}
    .navbar-brand{color:white!important; font-weight:bold}
    .profile-img{width:120px; height:120px; border-radius:50%; object-fit:cover; border:4px solid #ff6600}
    .menu-item-card{border-left:4px solid #ff6600}
</style>
</head>
<body>

<nav class="navbar px-3">
    <a class="navbar-brand">🍴 <span id="shopName">My Restaurant</span></a>
    <div>
        <a href="/restaurant-dashboard" class="btn btn-light btn-sm">Dashboard</a>
        <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <!-- PROFILE SECTION -->
        <div class="col-md-4">
            <div class="card shadow-sm p-3 mb-3">
                <h5>Restaurant Profile</h5>
                <div class="text-center">
                    <img id="profilePic" src="https://via.placeholder.com/120/ff6600/ffffff" class="profile-img mb-2">
                </div>
                <form id="profileForm" enctype="multipart/form-data">
                    <input type="text" name="restaurantName" id="restaurantName" class="form-control mb-2" placeholder="Restaurant Name" required>
                    <textarea name="address" id="address" class="form-control mb-2" placeholder="Address" rows="2" required></textarea>
                    <label class="small">Change Photo</label>
                    <input type="file" name="image" class="form-control mb-2" accept="image/*">
                    <button class="btn btn-warning w-100">Update Profile</button>
                </form>
                <div id="profileMsg" class="mt-2"></div>
            </div>
        </div>

        <!-- MENU SECTION -->
        <div class="col-md-8">
            <div class="card shadow-sm p-3">
                <h5>➕ Add New Menu Item</h5>
                <form id="addItemForm" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-8"><input type="text" name="name" class="form-control" placeholder="Item Name" required></div>
                        <div class="col-4"><input type="number" name="price" class="form-control" placeholder="Price" required></div>
                    </div>
                    <textarea name="desc" class="form-control mt-2" placeholder="Description" rows="2"></textarea>
                    <input type="file" name="image" class="form-control mt-2" accept="image/*">
                    <button class="btn btn-success w-100 mt-2">Add Item</button>
                </form>
                <div id="itemMsg" class="mt-2"></div>
            </div>

            <div class="card shadow-sm p-3 mt-3">
                <h5>📋 My Menu Items</h5>
                <div id="menuList"><p>Loading...</p></div>
            </div>
        </div>
    </div>
</div>

<script>
const API = window.location.origin;
const restaurantId = localStorage.getItem('restaurantId');
const restaurantData = JSON.parse(localStorage.getItem('restaurantOwner') || '{}');

if(!restaurantId) window.location.href = '/restaurant-login';

document.getElementById('shopName').innerText = restaurantData.restaurantName;
document.getElementById('restaurantName').value = restaurantData.restaurantName;
document.getElementById('address').value = restaurantData.address;
document.getElementById('profilePic').src = restaurantData.image || 'https://via.placeholder.com/120/ff6600/ffffff';

loadMenu();

// 1. UPDATE PROFILE
document.getElementById('profileForm').addEventListener('submit', async(e)=>{
    e.preventDefault();
    const formData = new FormData(e.target);
    formData.append('restaurantId', restaurantId);
    const res = await fetch(`${API}/api/restaurant-update`, {method:'POST', body:formData});
    const result = await res.json();
    document.getElementById('profileMsg').innerHTML = result.success? 
        `<div class="alert alert-success">✅ Updated!</div>` : 
        `<div class="alert alert-danger">❌ ${result.error}</div>`;
    if(result.success) localStorage.setItem('restaurantOwner', JSON.stringify(result.owner));
});

// 2. ADD MENU ITEM
document.getElementById('addItemForm').addEventListener('submit', async(e)=>{
    e.preventDefault();
    const formData = new FormData(e.target);
    formData.append('restaurantId', restaurantId);
    const res = await fetch(`${API}/api/menu-add`, {method:'POST', body:formData});
    const result = await res.json();
    document.getElementById('itemMsg').innerHTML = result.success? 
        `<div class="alert alert-success">✅ Item Added!</div>` : 
        `<div class="alert alert-danger">❌ ${result.error}</div>`;
    if(result.success){ e.target.reset(); loadMenu(); }
});

// 3. LOAD MENU
async function loadMenu(){
    const res = await fetch(`${API}/api/menu/${restaurantId}`);
    const items = await res.json();
    if(items.length === 0) return document.getElementById('menuList').innerHTML = '<p class="text-muted">Koi item nahi hai</p>';
    document.getElementById('menuList').innerHTML = items.map(item=>`
        <div class="card menu-item-card p-2 mb-2">
            <div class="d-flex">
                <img src="${item.image}" width="60" height="60" style="object-fit:cover; border-radius:8px">
                <div class="ms-2 flex-grow-1">
                    <h6 class="mb-0">${item.name} - ₹${item.price}</h6>
                    <small class="text-muted">${item.desc}</small>
                </div>
                <button class="btn btn-danger btn-sm" onclick="deleteItem('${item._id}')">Delete</button>
            </div>
        </div>
    `).join('');
}

async function deleteItem(id){
    if(!confirm('Delete this item?')) return;
    await fetch(`${API}/api/menu-delete/${id}`, {method:'DELETE'});
    loadMenu();
}

function logout(){ 
    localStorage.clear(); 
    window.location.href = '/restaurant-login'; 
}
</script>
</body>
</html>
