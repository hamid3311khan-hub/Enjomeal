<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - Eat4Bite™</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body{background:#f8f9fa}
    .navbar{background:#ff6600}
    .navbar-brand{color:white!important; font-weight:bold}
    .order-card{border-left:5px solid #ff6600}
    .status-badge{font-size:12px; padding:5px 10px; border-radius:20px}
    .status-Pending{background:#ffc107}
    .status-Preparing{background:#0d6efd; color:white}
    .status-Out{background:#fd7e14; color:white}
    .status-Delivered{background:#198754; color:white}
</style>
</head>
<body>

<nav class="navbar px-3">
    <a class="navbar-brand" href="/">← Eat4Bite™</a>
    <a href="/restaurants" class="btn btn-light btn-sm">Order Again</a>
</nav>

<div class="container mt-4">
    <h4 class="mb-3">📦 My Order History</h4>
    <div id="ordersList"><p class="text-center">Loading...</p></div>
</div>

<script>
const API = window.location.origin;
const phone = localStorage.getItem('userPhone'); // cart me save hota hai

if(!phone){
    document.getElementById('ordersList').innerHTML = '<div class="alert alert-warning">Pehle koi order karo. Phone number save ho jayega</div>';
}

loadOrders();

async function loadOrders(){
    try{
        const res = await fetch(`${API}/api/orders/history/${phone}`);
        const orders = await res.json();
        
        if(orders.length === 0){
            document.getElementById('ordersList').innerHTML = '<div class="alert alert-info">Abhi tak koi order nahi hai</div>';
            return;
        }

        document.getElementById('ordersList').innerHTML = orders.map(o=>`
            <div class="card order-card shadow-sm p-3 mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 class="mb-1"><b>${o.trackId}</b></h6>
                        <small class="text-muted">${new Date(o.createdAt).toLocaleString('hi-IN')}</small>
                    </div>
                    <span class="status-badge status-${o.status.split(' ')[0]}">${o.status}</span>
                </div>
                <hr>
                <p class="mb-1"><b>Items:</b> ${o.items.map(i=>`${i.name} x${i.qty}`).join(', ')}</p>
                <p class="mb-1"><b>Total:</b> ₹${o.grand_total} | <b>Payment:</b> ${o.paymentMode}</p>
                <p class="mb-2"><b>Address:</b> ${o.address}</p>
                
                <div class="d-flex gap-2">
                    <a href="/track?id=${o.trackId}" class="btn btn-outline-primary btn-sm">Track Order</a>
                    <button class="btn btn-warning btn-sm" onclick='reorder(${JSON.stringify(o.items)})'>Order Again</button>
                </div>
            </div>
        `).join('');

    }catch(err){
        document.getElementById('ordersList').innerHTML = '<div class="alert alert-danger">Orders load nahi hue</div>';
    }
}

function reorder(items){
    localStorage.setItem('cart', JSON.stringify(items));
    alert('Items cart me add ho gaye!');
    window.location.href = '/cart';
}
</script>
</body>
</html>
