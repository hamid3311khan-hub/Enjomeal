<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><title>Order Details</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial;background:#f5f5f5}.card{background:#fff;padding:20px;border-radius:10px;max-width:600px;margin:auto}</style></head><body>
<div class="card"><h2>📄 Order Receipt</h2>
<p><b>Order ID:</b> <span id="trackId"></span></p><p><b>Restaurant:</b> <span id="rest"></span></p><p><b>Status:</b> <span id="status"></span></p>
<div id="items"></div><h3>Total: ₹<span id="total"></span></h3>
<button onclick="location.href='/track.html?trackId='+trackId">Track Order</button>
<button onclick="location.href='/bill.html?trackId='+trackId">Download Bill</button></div>
<script>
const trackId=new URLSearchParams(location.search).get('trackId'); document.getElementById('trackId').innerText=trackId;
fetch(`/api/track/${trackId}`).then(r=>r.json()).then(o=>{
document.getElementById('rest').innerText=o.restaurantName; document.getElementById('status').innerText=o.status;
document.getElementById('total').innerText=o.grand_total; document.getElementById('items').innerHTML=o.items.map(i=>`<p>${i.name} - ₹${i.price}</p>`).join('');
});
</script></body></html>
