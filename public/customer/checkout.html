<!DOCTYPE html>
<html>
<head>
  <title>Checkout - QuickBite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
  <div class="navbar">
    <a href="/">← Back</a>
    <h3 style="margin:auto">Checkout</h3>
  </div>
  
  <div style="padding:15px">
    <!-- 1. ADDRESS -->
    <div class="card">
      <h3>📍 Delivery Address</h3>
      <input type="text" placeholder="House no, Street" id="address">
      <input type="text" placeholder="Phone Number" id="phone">
    </div>
    
    <!-- 2. ORDER SUMMARY -->
    <div class="card">
      <h3>🛒 Order Summary</h3>
      <p>Samosa x 2 <span style="float:right">₹78</span></p>
      <p>French fries x 1 <span style="float:right">₹126</span></p>
      <hr>
      <h3>Total: <span class="price">₹204</span></h3>
    </div>
    
    <!-- 3. PAYMENT METHOD -->
    <div class="card">
      <h3>💳 Payment Method</h3>
      
      <label><input type="radio" name="payment" value="COD" checked> Cash on Delivery</label><br><br>
      
      <label><input type="radio" name="payment" value="UPI"> Pay with UPI QR</label>
      
      <div id="qrSection" style="display:none; text-align:center; margin-top:15px">
        <p>Scan karke payment karo</p>
        <div id="qrcode"></div>
        <p style="font-size:12px">UPI ID: yourname@upi</p>
        <input type="file" id="screenshot" accept="image/*">
        <small>Screenshot upload karo</small>
      </div>
    </div>
    
    <button class="btn" style="width:100%; font-size:18px" onclick="placeOrder()">Place Order</button>
  </div>
  
  <script>
    // QR Code Generate
    const upiId = "yourname@upi"; // Yaha apna UPI ID daalo
    const amount = 204;
    const upiLink = `upi://pay?pa=${upiId}&pn=QuickBite&am=${amount}&cu=INR`;
    QRCode.toCanvas(document.getElementById('qrcode'), upiLink, {width: 200});
    
    // Show/Hide QR
    document.querySelectorAll('input[name="payment"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        document.getElementById('qrSection').style.display = e.target.value === 'UPI' ? 'block' : 'none';
      });
    });
    
    function placeOrder() {
      alert("Order Placed! COD ya QR screenshot ke saath");
      // Yaha API call lagega baad me
    }
  </script>
</body>
</html>
