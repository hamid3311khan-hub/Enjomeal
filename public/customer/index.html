<!DOCTYPE html>
<html>
<head>
  <title>QuickBite - Order Food Online</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="navbar">
    <a href="/">🏠 Home</a>
    <a href="/orders">📦 My Orders</a>
    <a href="/admin">🔒 Admin</a>
  </div>
  
  <div class="banner">🔥 50% OFF on First Order - CODE: FIRST50 🔥</div>
  
  <div style="padding:10px">
    <input type="text" placeholder="🔍 Search Pizza, Burger, Samosa...">
  </div>
  
  <div style="display:flex; gap:10px; overflow-x:auto; padding:10px">
    <div style="border:2px solid #ff5722; padding:8px 15px; border-radius:20px; background:#ff5722; color:white">All</div>
    <div style="border:2px solid #ff5722; padding:8px 15px; border-radius:20px; color:#ff5722">Starters</div>
    <div style="border:2px solid #ff5722; padding:8px 15px; border-radius:20px; color:#ff5722">Main course</div>
    <div style="border:2px solid #ff5722; padding:8px 15px; border-radius:20px; color:#ff5722">Rice</div>
  </div>
  
  <div class="grid">
    <div class="card">
      <img src="https://via.placeholder.com/300x150/ff5722/fff" style="width:100%; border-radius:8px">
      <h3>Samosa <span class="discount">-2%</span></h3>
      <small>40/pcs • Starters</small><br>
      <span class="price">₹39</span>
      <button class="btn" style="float:right">Add +</button>
    </div>
    
    <div class="card">
      <img src="https://via.placeholder.com/300x150/ff5722/fff" style="width:100%; border-radius:8px">
      <h3>French fries <span class="discount">-10%</span></h3>
      <small>Tasty n spicy • Starters</small><br>
      <span class="price">₹126</span>
      <button class="btn" style="float:right">Add +</button>
    </div>
  </div>
</body>
</html>
