<!DOCTYPE html>
<html>
<head><title>Daily Payout - Eat4Bite</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:20px}
.card{background:white;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 2px 5px #ccc}
.btn{background:#28a745;color:white;border:none;padding:8px 15px;border-radius:5px;cursor:pointer}
.btn-red{background:#dc3545;float:right}
h2{color:#ff4d4d}
#loginBox{max-width:400px;margin:100px auto}
#dashboard{display:none}
input{padding:10px;width:100%;margin:10px 0;box-sizing:border-box}
</style>
</head>
<body>

<!-- 1. LOGIN BOX -->
<div id="loginBox" class="card">
<h2>🔒 Admin Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="login()">Login</button>
<p id="msg" style="color:red"></p>
</div>

<!-- 2. DASHBOARD -->
<div id="dashboard">
    <div style="display:flex;justify-content:space-between">
        <h2>📅 Daily Payout - <span id="date"></span></h2>
        <button class="btn btn-red" onclick="logout()">Logout</button>
    </div>

    <h3>🏪 Restaurant Payout</h3>
    <div id="restList"></div>

    <h3>🚴 Rider Settlement</h3>
    <div id="riderList"></div>
</div>

<script>
// Page khulte hi check karega
checkLogin();

async function checkLogin(){
    const res = await fetch('/api/admin/check');
    const data = await res.json();
    if(data.loggedIn){
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        loadData();
    }
}

async function login(){
    const res = await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:user.value,password:pass.value})});
    const data = await res.json();
    if(data.success) location.reload();
    else msg.innerText = data.message;
}

async function logout(){
    await fetch('/api/admin/logout',{method:'POST'});
    location.reload();
}

async function loadData(){
    const res = await fetch('/api/admin/daily-payout');
    const data = await res.json();
    document.getElementById('date').innerText = data.date;

    let restHTML = '';
    data.restaurants.forEach(r=>{
        restHTML += `<div class="card">
        <b>${r.name}</b><br>
        Online Sale: ₹${r.online_sale} | Commission: ₹${r.commission.toFixed(2)}<br>
        <b>Payout Due: ₹${r.payout_due.toFixed(2)}</b>
        <button class="btn" onclick="markPaid('restaurant',${r.id},${r.payout_due})">Paid Karo</button>
        </div>`
    });
    document.getElementById('restList').innerHTML = restHTML || 'Aaj koi online order nahi';

    let riderHTML = '';
    data.riders.forEach(r=>{
        riderHTML += `<div class="card">
        <b>${r.name}</b><br>
        COD Collect: ₹${r.cod_collect} | Delivery Earn: ₹${r.delivery_earn}<br>
        <b>Cash Dena Hai: ₹${r.cash_to_give}</b>
        <button class="btn" onclick="markPaid('rider',${r.id},${r.cash_to_give})">Settled</button>
        </div>`
    });
    document.getElementById('riderList').innerHTML = riderHTML || 'Aaj koi delivery nahi';
}

async function markPaid(type,id,amount){
    if(!confirm(`₹${amount} Paid Mark kare?`)) return;
    await fetch('/api/admin/mark-paid',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,id,amount})});
    alert('Done!');
    loadData();
}
</script>
</body>
</html>
