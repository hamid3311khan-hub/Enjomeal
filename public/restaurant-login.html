<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant Login - Eat4Bite™</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body{background:linear-gradient(135deg,#ff6600,#ff3300); min-height:100vh; display:flex; align-items:center; justify-content:center}
.card{max-width:450px; border-radius:20px; box-shadow:0 10px 40px rgba(0,0,0,0.3)}
.logo{font-size:32px; font-weight:bold; color:#ff6600; text-align:center; margin-bottom:10px}
</style>
</head>
<body>
<div class="container">
    <div class="card shadow p-4">
        <div class="logo">🍴 Eat4Bite™</div>
        <h4 class="text-center mb-3">Restaurant Login</h4>
        <p class="text-center text-muted">Apne dashboard me login karein</p>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-bold">Mobile Number</label>
                <input type="tel" name="mobile" class="form-control form-control-lg" placeholder="10 digit mobile" pattern="[0-9]{10}" maxlength="10" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" name="password" class="form-control form-control-lg" required>
            </div>
            <button type="submit" id="loginBtn" class="btn w-100 btn-lg fw-bold" style="background:#ff6600; color:white;">Login</button>
        </form>

        <div id="msg" class="mt-3"></div>
        <p class="text-center mt-3">Naya Restaurant hai? <a href="/restaurant-register">Register karein</a></p>
    </div>
</div>

<script>
const API = window.location.origin;

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.innerText = "Logging in...";
    
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());

    try {
        const res = await fetch(`${API}/api/restaurant-login`, {
            method: 'POST', 
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if(result.success){
            // IMPORTANT: Ye 3 cheez localStorage me save karni hai
            localStorage.setItem('restaurantOwner', JSON.stringify(result.owner));
            localStorage.setItem('restaurantId', result.owner.restaurantId);
            localStorage.setItem('restaurantName', result.owner.restaurantName);
            
            document.getElementById('msg').innerHTML = `<div class="alert alert-success">✅ Login Success! Redirecting...</div>`;
            setTimeout(()=>{ window.location.href = '/restaurant-dashboard'; }, 1500); // .html hata diya
        } else {
            document.getElementById('msg').innerHTML = `<div class="alert alert-danger">❌ ${result.error || 'Login Failed'}</div>`;
        }
    } catch(err) {
        document.getElementById('msg').innerHTML = `<div class="alert alert-danger">Server Error: ${err.message}</div>`;
    }
    btn.disabled = false; btn.innerText = "Login";
});
</script>
</body>
</html>
