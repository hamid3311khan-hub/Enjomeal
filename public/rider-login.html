<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><title>Rider Login</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{background:#f5f5f5}.card{background:#fff;padding:20px;max-width:400px;margin:50px auto;border-radius:10px}input{width:95%;padding:10px;margin:8px 0}</style></head><body>
<div class="card"><h2>🚚 Rider Login</h2>
<input id="phone" placeholder="Phone">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()" style="width:100%;padding:12px;background:#ff6600;color:#fff;border:none">Login</button></div>
<script>
const API="/api";
async function login(){
  let res=await fetch(`${API}/rider/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value,password:pass.value})});
  let data=await res.json();
  if(data.success){localStorage.setItem('rider',JSON.stringify(data.rider)); location.href='/rider-dashboard.html'} else alert("Invalid or Not Approved")
}
</script></body></html>
