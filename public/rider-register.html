<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rider Registration - Eat4Bite™</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body{background:linear-gradient(135deg,#28a745,#20c997); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px}
.card{max-width:550px; border-radius:20px; box-shadow:0 10px 40px rgba(0,0,0,0.3)}
.logo{font-size:32px; font-weight:bold; color:#28a745; text-align:center; margin-bottom:10px}
.info-box{background:#d4edda; padding:15px; border-radius:10px; border:1px solid #28a745}
</style>
</head>
<body>
<div class="container">
    <div class="card shadow p-4">
        <div class="logo">🏍️ Eat4Bite™ Rider</div>
        <h4 class="text-center mb-3">Join As Delivery Partner</h4>
        <p class="text-center text-success fw-bold">Earn ₹15,000 - ₹25,000 / Month</p>

        <div class="info-box mb-3">
            <b>Requirements:</b>
            <ul class="mb-0 small">
                <li>Bike + DL + Aadhaar</li>
                <li>Smartphone with Internet</li>
                <li>Barkagaon me rehte ho</li> <!-- FIXED: Madhubani -> Barkagaon -->
            </ul>
        </div>

        <form id="riderRegisterForm" enctype="multipart/form-data">
            <div class="row">
                <div class="col-6 mb-3">
                    <label class="form-label fw-bold">Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="col-6 mb-3">
                    <label class="form-label fw-bold">Mobile Number</label>
                    <input type="tel" name="phone" class="form-control" pattern="[0-9]{10}" maxlength="10" required> <!-- FIX: mobile -> phone -->
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Address</label>
                <textarea name="address" class="form-control" rows="2" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Bike Number</label>
                <input type="text" name="vehicle" class="form-control" placeholder="JH12 AB 1234" required> <!-- FIX: vehicleNo -> vehicle -->
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Upload DL Photo</label>
                <input type="file" name="dlProof" class="form-control" accept="image/*" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Upload Aadhaar Photo</label>
                <input type="file" name="aadharImg" class="form-control" accept="image/*" required> <!-- FIX: aadhaarProof -> aadharImg -->
            </div>

            <button type="submit" id="registerBtn" class="btn w-100 btn-lg fw-bold" style="background:#28a745; color:white;">Apply Now</button>
        </form>

        <div id="msg" class="mt-3"></div>
        <p class="text-center mt-3">Already have an account? <a href="/rider-login.html">Login</a></p> <!-- FIXED -->
    </div>
</div>

<script>
const API = "/api"; // FIXED

document.getElementById('riderRegisterForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    btn.disabled = true; btn.innerText = "Submitting...";

    const formData = new FormData(e.target);
    formData.append('status', 'pending'); // Admin approval ke liye

    try {
        const res = await fetch(`${API}/rider/register`, { // FIXED URL
            method: 'POST',
            body: formData
        });
        const result = await res.json();

        if(result.success){
            document.getElementById('riderRegisterForm').style.display = 'none';
            document.getElementById('msg').innerHTML = `
            <div class="alert alert-success">
                ✅ Application Submitted!<br>
                Admin 24 hours me verify karke call karega.
                Status check karne ke liye login karein.
            </div>`;
        } else {
            document.getElementById('msg').innerHTML = `<div class="alert alert-danger">❌ ${result.error || result.msg}</div>`;
        }
    } catch(err) {
        document.getElementById('msg').innerHTML = `<div class="alert alert-danger">Server Error: ${err.message}</div>`;
    }
    btn.disabled = false; btn.innerText = "Apply Now";
});
</script>
</body>
</html>
