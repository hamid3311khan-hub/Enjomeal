<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><title>Rider Register</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{background:#f5f5f5}.card{background:#fff;padding:20px;max-width:400px;margin:30px auto;border-radius:10px}input{width:95%;padding:10px;margin:8px 0}</style></head><body>
<div class="card"><h2>🚚 Rider Registration</h2>
<input id="name" placeholder="Full Name">
<input id="phone" placeholder="Phone">
<input id="email" placeholder="Email">
<input id="vehicle" placeholder="Vehicle No">
<input id="pass" type="password" placeholder="Password">
<label>DL Photo:</label><input id="dl" type="file">
<label>Aadhar Photo:</label><input id="aadhar" type="file">
<button onclick="register()" style="width:100%;padding:12px;background:#ff6600;color:#fff;border:none">Register</button>
<p>Already have account? <a href="/rider-login.html">Login</a></p></div>
<script>
const API="/api";
async function register(){
  let fd=new FormData();
  fd.append('name',name.value); fd.append('phone',phone.value); fd.append('email',email.value);
  fd.append('vehicle',vehicle.value); fd.append('password',pass.value);
  fd.append('dlProof',dl.files[0]); fd.append('aadharImg',aadhar.files[0]);
  let res=await fetch(`${API}/rider/register`,{method:'POST',body:fd}); let data=await res.json();
  if(data.success){alert("Registered. Waiting for Admin Approval"); location.href='/rider-login.html'}
}
</script></body></html>
