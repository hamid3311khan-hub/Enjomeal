<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Track Order - Eat4Bite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body{font-family:Arial; background:#f4f4f4; padding:10px}
.header{background:#4caf50; color:#fff; padding:15px; border-radius:8px; text-align:center}
.box{background:#fff; padding:15px; margin:10px 0; border-radius:8px; box-shadow:0 2px 5px #ccc}
#map{width:100%; height:400px; border-radius:8px; margin-top:10px}
.status{padding:8px; border-radius:5px; font-weight:bold; text-transform:capitalize}
.pending{background:#ffc107} .accepted{background:#2196f3; color:#fff} 
.ready{background:#ff9800; color:#fff} .outfordelivery{background:#3f51b5; color:#fff}
.delivered{background:#4caf50; color:#fff}
</style>
</head>
<body>

<div class="header">
  <h2>🚚 Track Your Order</h2>
  <p>Order ID: <span id="trackId"></span></p>
</div>

<div class="box">
  <h3>Status: <span id="status" class="status">Loading...</span></h3>
  <p><b>Restaurant:</b> <span id="restaurant">Loading...</span></p>
  <p><b>Address:</b> <span id="address"></span></p>
  <p><b>Total:</b> ₹<span id="total"></span></p>
  <p><b>Rider:</b> <span id="rider">Finding rider...</span></p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="/socket.io/socket.io.js"></script>

<script>
const API = "/api";
const socket = io();
const urlParams = new URLSearchParams(window.location.search);
const trackId = urlParams.get('trackId');

// MAP INIT - MADHUBANI DEFAULT
let map = L.map('map').setView([26.3547, 86.0841], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let riderMarker, shopMarker, custMarker;

if(!trackId){
  alert("Error: Order ID nahi mila. URL me ?trackId=xxx add karo");
  document.getElementById('status').innerText = "Invalid Order";
} else {
  document.getElementById('trackId').innerText = trackId;
  socket.emit('joinOrderRoom', trackId);
  loadOrder();
  setInterval(loadOrder, 5000); // 5 sec me refresh
}

// RIDER LOCATION LIVE UPDATE
socket.on('riderLocationUpdate', (data) => {
  if(data.trackId === trackId){
    if(riderMarker){
      riderMarker.setLatLng([data.lat, data.lng]);
    } else {
      riderMarker = L.marker([data.lat, data.lng], {
        icon: L.icon({iconUrl: 'https://cdn-icons-png.flaticon.com/512/1076/1076986.png', iconSize: [35,35]})
      }).addTo(map).bindPopup("🚚 Rider");
      map.setView([data.lat, data.lng], 15);
    }
  }
});

async function loadOrder(){
  try{
    let res = await fetch(`${API}/orders/track/${trackId}`);
    let o = await res.json();
    if(!o){ 
      document.getElementById('status').innerText = "Order Not Found";
      return;
    }

    let statusClass = o.status.toLowerCase().replace(/ /g,''); // FIX 1: space hatao
    document.getElementById('status').innerText = o.status;
    document.getElementById('status').className = `status ${statusClass}`;
    document.getElementById('address').innerText = o.address;
    document.getElementById('total').innerText = o.grand_total;
    document.getElementById('rider').innerText = o.riderName || "Finding rider...";

    // Restaurant name
    let shopRes = await fetch(`${API}/restaurant-profile?restaurantId=${o.restaurantId}`);
    let shop = await shopRes.json();
    document.getElementById('restaurant').innerText = shop.restaurantName;

    // FIX 2: Shop + Customer marker bhi dikhao
    if(shopMarker) map.removeLayer(shopMarker);
    if(custMarker) map.removeLayer(custMarker);
    
    shopMarker = L.marker([o.shopLat, o.shopLng]).addTo(map).bindPopup("🏪 " + shop.restaurantName);
    custMarker = L.marker([o.custLat || 26.3547, o.custLng || 86.0841]).addTo(map).bindPopup("📍 Your Location");

    // Agar order me pehle se rider location hai
    if(o.riderLat && o.riderLng){
      if(!riderMarker){
        riderMarker = L.marker([o.riderLat, o.riderLng]).addTo(map).bindPopup("🚚 Rider");
      } else {
        riderMarker.setLatLng([o.riderLat, o.riderLng]);
      }
    }

  }catch(e){
    console.log("API Error:", e);
  }
}
</script>
</body>
</html>
