<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><title>Track Order</title><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>body{background:#f4f4f4;padding:10px}.header{background:#ff6600;color:#fff;padding:15px;text-align:center}#map{width:100%;height:400px}</style></head><body>
<div class="header"><h2>🚚 Track Your Order</h2><p>Order ID: <span id="trackId"></span></p></div>
<div><h3>Status: <span id="status">Loading...</span></h3><p><b>Restaurant:</b> <span id="restaurant"></span></p><p><b>Rider:</b> <span id="rider">Finding...</span></p></div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script><script src="/socket.io/socket.io.js"></script>
<script>
const API="/api"; const socket=io(); const trackId=new URLSearchParams(location.search).get('trackId');
document.getElementById('trackId').innerText=trackId; let map=L.map('map').setView([23.6357,85.1920],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let riderMarker, shopMarker, custMarker; socket.emit('joinOrderRoom', trackId); loadOrder(); setInterval(loadOrder,5000);
socket.on('riderLocationUpdate', (data)=>{ if(data.trackId===trackId && riderMarker) riderMarker.setLatLng([data.lat,data.lng]) });
async function loadOrder(){
  let o=await fetch(`${API}/track/${trackId}`).then(r=>r.json()); if(!o)return;
  document.getElementById('status').innerText=o.status; document.getElementById('restaurant').innerText=o.restaurantName; document.getElementById('rider').innerText=o.riderName||"Finding...";
  if(shopMarker)map.removeLayer(shopMarker); shopMarker=L.marker([o.shopLat||23.6357,o.shopLng||85.1920]).addTo(map).bindPopup("🏪 "+o.restaurantName);
  if(custMarker)map.removeLayer(custMarker); custMarker=L.marker([o.custLat||23.6357,o.custLng||85.1920]).addTo(map).bindPopup("📍 You");
  if(o.riderLat&&o.riderLng){ if(!riderMarker){riderMarker=L.marker([o.riderLat,o.riderLng]).addTo(map).bindPopup("🚚 Rider")}else{riderMarker.setLatLng([o.riderLat,o.riderLng])}}
}
</script></body></html>
