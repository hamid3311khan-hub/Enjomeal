<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><title>Payment</title><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>body{font-family:Arial;background:#f5f5f5;padding:10px}.card{background:#fff;padding:20px;border-radius:10px;max-width:500px;margin:auto}input,textarea{width:95%;padding:10px;margin:5px 0}</style></head><body>
<div class="card"><h2>💳 Payment</h2><div id="summary"></div>
<input id="name" placeholder="Your Name" required><textarea id="address" placeholder="Full Address" required></textarea><input id="phone" placeholder="Mobile" required>
<label><input type="radio" name="pay" value="COD" checked> COD</label>
<label><input type="radio" name="pay" value="ONLINE"> UPI/Card</label>
<button onclick="placeOrder()" style="width:100%;padding:12px;background:#ff6600;color:#fff;border:none">Pay ₹<span id="total"></span></button></div>
<script>
const API="/api"; let cart=JSON.parse(localStorage.getItem('cart')||'[]');
let total=cart.reduce((a,b)=>a+b.price,0); document.getElementById('total').innerText=total;
document.getElementById('summary').innerHTML=cart.map(i=>`<p>${i.name} - ₹${i.price}</p>`).join('')+`<hr><h3>Total: ₹${total}</h3>`;

async function placeOrder(){
const payMethod = document.querySelector('input[name="pay"]:checked').value;
const orderData = {items:cart,restaurantId:cart[0].restaurantId,restaurantName:"Barkagaon Biryani",customerName:name.value,address:address.value,phone:phone.value,grand_total:total,payment:payMethod};

if(payMethod==="ONLINE"){
  let r=await fetch(`${API}/order/create-razorpay`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:total})}).then(res=>res.json());
  var options = {key:"rzp_test_XXXX", amount: r.amount, order_id: r.id, name:"Eat4Bite", handler: function(resp){orderData.razorpay_payment_id=resp.razorpay_payment_id; finalOrder(orderData)} };
  var rzp = new Razorpay(options); rzp.open();
}else{ finalOrder(orderData) }
}
async function finalOrder(data){let res=await fetch(`${API}/order/place`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let d=await res.json(); if(d.success){localStorage.removeItem('cart');location.href=`/order.html?trackId=${d.trackId}`}else alert("Error")}
</script></body></html>
