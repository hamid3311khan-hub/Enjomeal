<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><title>Approve Riders</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{background:#f5f5f5}.card{background:#fff;padding:15px;margin:10px;border-radius:8px}img{width:100px;height:100px}</style></head><body>
<h2>🚚 Pending Riders</h2><div id="list"></div>
<script>
const API="/api";
load();
function load(){fetch(`${API}/admin/riders`).then(r=>r.json()).then(data=>{
document.getElementById('list').innerHTML=data.map(r=>`
<div class="card"><h3>${r.name}</h3><p>${r.phone}</p><p>Vehicle: ${r.vehicle}</p><p>Status: <b>${r.status}</b></p>
<img src="${r.dlProof}"><img src="${r.aadharImg}">
<button onclick="approve('${r._id}')">Approve</button>
<button onclick="reject('${r._id}')">Reject</button></div>`).join('')})}
function approve(id){fetch(`${API}/admin/rider/approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({riderId:id})}).then(()=>load())}
function reject(id){fetch(`${API}/admin/rider/reject`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({riderId:id})}).then(()=>load())}
</script></body></html>
