<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restaurant Dashboard - Eat4Bite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial; background:#f5f5f5; margin:0}
.header{background:#4caf50; color:#fff; padding:15px; display:flex; justify-content:space-between}
.container{padding:15px}
.tabs{display:flex; gap:10px; margin:15px 0}
.tab{padding:10px 15px; background:#fff; border-radius:8px; cursor:pointer; border:2px solid #4caf50}
.tab.active{background:#4caf50; color:#fff}
.box{background:#fff; padding:15px; border-radius:8px; margin:10px 0; box-shadow:0 2px 5px #ccc}
input,textarea,select{width:95%; padding:8px; margin:5px 0; border:1px solid #ddd; border-radius:5px}
.btn{background:#4caf50; color:#fff; padding:10px 15px; border:none; border-radius:5px; cursor:pointer}
.btn-red{background:#f44336}
.menu-item{display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee}
.order-card{background:#fff8e1; padding:10px; margin:10px 0; border-left:4px solid #ff9800}
</style>
</head>
<body>

<div class="header">
  <h2>🏪 Restaurant Panel</h2>
  <button class="btn btn-red" onclick="logout()">Logout</button>
</div>

<div class="container">
  <div class="tabs">
    <div class="tab active" onclick="showTab('menu')">1. Menu</div>
    <div class="tab" onclick="showTab('orders')">2. Orders</div>
    <div class="tab" onclick="showTab('payout')">3. Payout</div>
  </div>

  <!-- TAB 1: MENU -->
  <div id="menuTab">
    <h3>Add New Item</h3>
    <div class="box">
      <input type="text" id="itemName" placeholder="Item Name e.g. Veg Biryani">
      <input type="number" id="price" placeholder="Price ₹">
      <textarea id="desc" placeholder="Description"></textarea>
      <select id="category">
        <option>Veg</option><option>Non-Veg</option><option>Beverages</option>
      </select>
      <input type="file" id="itemImage">
      <button class="btn" onclick="addMenuItem()">Add Item</button>
    </div>
    <h3>Your Menu</h3>
    <div id="menuList">Loading...</div>
  </div>

  <!-- TAB 2: ORDERS -->
  <div id="ordersTab" style="display:none">
    <h3>New Orders</h3>
    <div id="ordersList">Loading...</div>
  </div>

  <!-- TAB 3: PAYOUT -->
  <div id="payoutTab" style="display:none">
    <h3>Your Earnings</h3>
    <div class="box">
      <h2>Total Due: ₹<span id="payoutDue">0</span></h2>
      <p>Admin will pay weekly</p>
    </div>
  </div>
</div>

<script>
const API = "/api";
const restaurantId = localStorage.getItem('restaurantId');
if(!restaurantId) window.location = '/restaurant-login';

loadMenu(); loadOrders(); loadPayout();

function showTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('#menuTab, #ordersTab, #payoutTab').forEach(d=>d.style.display='none');
  if(tab==='menu'){menuTab.style.display='block'; document.querySelectorAll('.tab')[0].classList.add('active')}
  if(tab==='orders'){ordersTab.style.display='block'; document.querySelectorAll('.tab')[1].classList.add('active'); loadOrders()}
  if(tab==='payout'){payoutTab.style.display='block'; document.querySelectorAll('.tab')[2].classList.add('active'); loadPayout()}
}

// MENU FUNCTIONS
async function addMenuItem(){
  const formData = new FormData();
  formData.append('restaurantId', restaurantId);
  formData.append('name', itemName.value);
  formData.append('price', price.value);
  formData.append('description', desc.value);
  formData.append('category', category.value);
  formData.append('image', itemImage.files[0]);

  let res = await fetch(`${API}/restaurant/add-menu`, {method:'POST', body:formData});
  if(res.ok){ alert('Item Added'); loadMenu(); itemName.value=''; price.value='' } else alert('Error')
}

async function loadMenu(){
  let res = await fetch(`${API}/restaurant/menu/${restaurantId}`);
  let items = await res.json();
  menuList.innerHTML = items.length===0? 'No items yet' : items.map(i=>`
    <div class="menu-item">
      <div><b>${i.name}</b> - ₹${i.price}<br><small>${i.category}</small></div>
      <button class="btn btn-red" onclick="deleteItem('${i._id}')">Delete</button>
    </div>
  `).join('');
}

async function deleteItem(id){
  await fetch(`${API}/restaurant/delete-menu/${id}`, {method:'DELETE'});
  loadMenu();
}

// ORDERS + PAYOUT
async function loadOrders(){
  let res = await fetch(`${API}/restaurant/orders/${restaurantId}`);
  let orders = await res.json();
  ordersList.innerHTML = orders.length===0? 'No new orders' : orders.map(o=>`
    <div class="order-card">
      <b>Order #${o.orderId}</b> - ₹${o.total}<br>
      Customer: ${o.customerName} | ${o.mobile}<br>
      <button class="btn" onclick="acceptOrder('${o._id}')">Accept</button>
    </div>
  `).join('');
}

async function loadPayout(){
  let res = await fetch(`${API}/restaurant/payout/${restaurantId}`);
  let data = await res.json();
  payoutDue.innerText = data.payout_due || 0;
}

function logout(){
  localStorage.removeItem('restaurantId');
  window.location = '/';
}
</script>
</body>
</html>
