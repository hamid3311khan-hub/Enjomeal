<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restaurant Dashboard - Eat4Bite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial; background:#f4f4f4; padding:10px}
.header{background:#ff5722; color:#fff; padding:15px; border-radius:8px; display:flex; justify-content:space-between}
.box{background:#fff; padding:15px; margin:10px 0; border-radius:8px; box-shadow:0 2px 5px #ccc; border-left:5px solid #ff5722}
.btn{padding:8px 15px; border:none; border-radius:5px; cursor:pointer; margin:5px}
.btn-green{background:#28a745; color:#fff}
.btn-red{background:#dc3545; color:#fff}
.new-order{animation: blink 1s infinite}
@keyframes blink {50% {background:#ffe082}}
</style>
</head>
<body>

<div class="header">
  <div>
    <h2 id="shopName">Restaurant Dashboard</h2>
    <p>Payout Due: ₹<span id="payout">0</span></p>
  </div>
  <button onclick="logout()" class="btn btn-red">Logout</button>
</div>

<audio id="tingSound" src="/sound.mp3" preload="auto"></audio>

<h3>🔔 Live Orders</h3>
<div id="orders">Loading...</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const API = "/api";
const socket = io();
let restaurantId = localStorage.getItem('restaurantId') || 'default-shop';

// LOGIN CHECK
if(!restaurantId) window.location = '/restaurant-login.html';

loadData();

// 1. NAYA ORDER AAYE TO TING + REFRESH
socket.on('newOrder', (order) => {
  if(order.restaurantId === restaurantId){
    document.getElementById('tingSound').play(); // TING SOUND
    alert("🔔 Naya Order Aaya: " + order.trackId);
    loadData();
  }
});

async function loadData(){
  // Restaurant info
  let res = await fetch(`${API}/restaurant-profile?restaurantId=${restaurantId}`);
  let shop = await res.json();
  document.getElementById('shopName').innerText = shop.restaurantName;
  document.getElementById('payout').innerText = shop.payout_due;

  // Orders
  res = await fetch(`${API}/orders?restaurantId=${restaurantId}`);
  let orders = await res.json();
  document.getElementById('orders').innerHTML = orders.length===0 ? "No orders" : orders.map(o => `
    <div class="box ${o.status==='Pending' ? 'new-order' : ''}">
      <b>Order: ${o.trackId}</b> | Status: ${o.status}<br>
      Customer: ${o.name} - ${o.phone}<br>
      Total: ₹${o.grand_total} | Payment: ${o.paymentMode}<br>
      Address: ${o.address}<br>
      ${o.status==='Pending' ? `
        <button class="btn btn-green" onclick="updateStatus('${o._id}', 'Accepted')">Accept</button>
        <button class="btn btn-red" onclick="updateStatus('${o._id}', 'Rejected')">Reject</button>
      ` : ''}
      ${o.status==='Accepted' ? `
        <button class="btn btn-green" onclick="updateStatus('${o._id}', 'Ready')">Ready</button>
      ` : ''}
    </div>
  `).join('');
}

async function updateStatus(id, status){
  await fetch(`${API}/orders/${id}/status`, {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({status})
  });
  loadData();
}

function logout(){
  localStorage.clear();
  window.location = '/';
}
</script>
</body>
</html>
