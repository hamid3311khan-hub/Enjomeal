<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restaurant Dashboard - Eat4Bite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial; background:#fff3e0; padding:10px}
.header{background:#ff9800; color:#fff; padding:15px; border-radius:8px; display:flex; justify-content:space-between}
.box{background:#fff; padding:15px; margin:10px 0; border-radius:8px; box-shadow:0 2px 5px #ccc; border-left:5px solid #ff9800}
.btn{padding:10px 20px; border:none; border-radius:5px; cursor:pointer; font-size:16px; margin:5px}
.btn-green{background:#4caf50; color:#fff}
.btn-red{background:#f44336; color:#fff}
.new-order{animation: blink 1s infinite}
@keyframes blink {50% {background:#fff9c4}}
</style>
</head>
<body>

<div class="header">
  <div>
    <h2 id="shopName">Restaurant Panel</h2>
    <p>Payout Due: ₹<span id="payout">0</span></p>
  </div>
  <button onclick="logout()" class="btn btn-red">Logout</button>
</div>

<audio id="tingSound" src="/sound.mp3" preload="auto"></audio>

<h3>🔔 New Orders</h3>
<div id="orders">Loading...</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const API = "/api";
const socket = io();
let restaurantId = localStorage.getItem('restaurantId');

// LOGIN CHECK
if(!restaurantId) window.location = '/restaurant-login.html';

loadData();

// 1. NAYA ORDER AAYE TO TING
socket.on('newOrder', (order) => {
  if(order.restaurantId === restaurantId){
    document.getElementById('tingSound').play();
    alert("🔔 Naya Order: " + order.trackId);
    loadData();
  }
});

async function loadData(){
  // Shop info
  let res = await fetch(`${API}/restaurant-profile?restaurantId=${restaurantId}`);
  let shop = await res.json();
  document.getElementById('shopName').innerText = shop.restaurantName;
  document.getElementById('payout').innerText = shop.payout_due;

  // Pending Orders
  res = await fetch(`${API}/orders?restaurantId=${restaurantId}&status=Pending`);
  let orders = await res.json();
  document.getElementById('orders').innerHTML = orders.length===0? "No new orders" : orders.map(o => `
    <div class="box new-order">
      <b>Order: ${o.trackId}</b> | ₹${o.grand_total} - ${o.paymentMode}<br>
      Customer: ${o.name} - ${o.phone}<br>
      Address: ${o.address}<br>
      Items: ${o.items.map(i=>i.name+' x'+i.qty).join(', ')}<br><br>
      <button class="btn btn-green" onclick="updateStatus('${o._id}','Accepted')">Accept</button>
      <button class="btn btn-red" onclick="updateStatus('${o._id}','Rejected')">Reject</button>
    </div>
  `).join('');
}

async function updateStatus(orderId, status){
  await fetch(`${API}/orders/${orderId}/status`, {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({status})
  });
  alert("Order " + status);
  loadData();
}

function logout(){
  localStorage.clear();
  window.location = '/';
}
</script>
</body>
</html>
