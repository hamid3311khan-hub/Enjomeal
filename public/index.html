<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eat4Bite - Order Food Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial; background:#f5f5f5; margin:0}
.header{background:#4caf50; color:#fff; padding:15px; position:sticky; top:0; z-index:10}
.header h1{margin:0}
.search{width:90%; padding:10px; border-radius:20px; border:none; margin-top:10px}
.container{padding:15px}
.restaurant-card{background:#fff; border-radius:10px; padding:10px; margin:10px 0; box-shadow:0 2px 5px #ccc; cursor:pointer; display:flex}
.restaurant-card img{width:100px; height:100px; border-radius:8px; object-fit:cover; margin-right:10px}
.cart-btn{position:fixed; bottom:20px; right:20px; background:#ff9800; color:#fff; padding:15px 25px; border-radius:50px; border:none; font-size:16px; font-weight:bold; box-shadow:0 4px 10px #0003}
.badge{background:#f44336; color:#fff; border-radius:50%; padding:2px 8px; font-size:12px}
</style>
</head>
<body>

<div class="header">
  <h1>🍴 Eat4Bite</h1>
  <input type="text" class="search" id="search" placeholder="Search restaurants..." onkeyup="searchRestaurants()">
</div>

<div class="container">
  <h3>Approved Restaurants Near You</h3>
  <div id="restaurantList">Loading...</div>
</div>

<button class="cart-btn" onclick="window.location='/cart.html'">
  🛒 Cart <span class="badge" id="cartCount">0</span>
</button>

<script>
const API = "/api";
loadRestaurants();
updateCartCount();

async function loadRestaurants(){
  let res = await fetch(`${API}/admin-restaurants`);
  let shops = await res.json();
  shops = shops.filter(s => s.status === 'approved'); // sirf approved
  
  document.getElementById('restaurantList').innerHTML = shops.map(s => `
    <div class="restaurant-card" onclick="openMenu('${s._id}')">
      <img src="${s.logo || 'https://via.placeholder.com/100'}" alt="">
      <div>
        <h3>${s.restaurantName}</h3>
        <p>${s.address}</p>
        <p>⭐ 4.5 | 30-40 min | ${s.commission}% Commission</p>
      </div>
    </div>
  `).join('');
}

function searchRestaurants(){
  let val = document.getElementById('search').value.toLowerCase();
  let cards = document.querySelectorAll('.restaurant-card');
  cards.forEach(c => {
    c.style.display = c.innerText.toLowerCase().includes(val) ? 'flex' : 'none';
  });
}

function openMenu(id){
  window.location = `/menu.html?restaurantId=${id}`;
}

function updateCartCount(){
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  let total = cart.reduce((sum,i)=>sum+i.qty,0);
  document.getElementById('cartCount').innerText = total;
}
</script>
</body>
</html>
