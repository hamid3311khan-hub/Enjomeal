<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eat4Bite - Order Food Online</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial; background:#f5f5f5; margin:0}
.header{background:#4caf50; color:#fff; padding:15px; position:sticky; top:0}
.search{width:95%; padding:10px; border-radius:20px; border:none; margin-top:10px}
.container{padding:15px}
.restaurant-card{background:#fff; border-radius:10px; padding:10px; margin:10px 0; box-shadow:0 2px 5px #ccc; display:flex; cursor:pointer}
.restaurant-card img{width:90px; height:90px; border-radius:8px; object-fit:cover; margin-right:10px}
.cart-btn{position:fixed; bottom:20px; right:20px; background:#ff9800; color:#fff; padding:15px 25px; border-radius:50px; border:none; font-weight:bold}
.empty-state{text-align:center; padding:40px 20px; color:#777}
.empty-state h3{color:#333}
</style>
</head>
<body>

<div class="header">
  <h1>🍴 Eat4Bite</h1>
  <input type="text" class="search" id="search" placeholder="Search restaurants..." onkeyup="searchRestaurants()">
</div>

<div class="container">
  <h3>Approved Restaurants Near You</h3>
  <div id="restaurantList">
    <p style="text-align:center">Loading restaurants...</p>
  </div>
</div>

<button class="cart-btn" onclick="window.location='/cart.html'">
  🛒 Cart <span id="cartCount">0</span>
</button>

<script>
const API = "/api";
loadRestaurants();
updateCartCount();

async function loadRestaurants(){
  try{
    let res = await fetch(`${API}/admin-restaurants`);
    if(!res.ok) throw new Error("Network error");
    
    let shops = await res.json();
    shops = shops.filter(s => s.status === 'approved');
    
    if(shops.length === 0){
      document.getElementById('restaurantList').innerHTML = `
        <div class="empty-state">
          <h3>😔 No Restaurants Yet</h3>
          <p>We are adding new restaurants soon. Please check back later!</p>
          <p><small>Admin: Go to /admin-restaurants to approve restaurants</small></p>
        </div>
      `;
      return;
    }

    document.getElementById('restaurantList').innerHTML = shops.map(s => `
      <div class="restaurant-card" onclick="openMenu('${s._id}')">
        <img src="${s.logo || 'https://via.placeholder.com/90/CCCCCC/FFFFFF?text=Shop'}" alt="">
        <div>
          <h3>${s.restaurantName}</h3>
          <p>${s.address}</p>
          <p>⭐ 4.5 | 30-40 min Delivery</p>
        </div>
      </div>
    `).join('');
    
  }catch(e){
    document.getElementById('restaurantList').innerHTML = `
      <div class="empty-state">
        <h3>⚠️ Server Error</h3>
        <p>Could not load restaurants. Please try again later.</p>
      </div>
    `;
    console.log("API Error:", e);
  }
}

function searchRestaurants(){
  let val = document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('.restaurant-card').forEach(c => {
    c.style.display = c.innerText.toLowerCase().includes(val) ? 'flex' : 'none';
  });
}

function openMenu(id){
  window.location = `/menu.html?restaurantId=${id}`;
}

function updateCartCount(){
  let cart = JSON.parse(localStorage.getItem('cart')) || [];
  let total = cart.reduce((sum,i)=>sum+i.qty,0);
  document.getElementById('cartCount').innerText = total;
  if(total === 0) document.getElementById('cartCount').style.display = 'none';
}
</script>
</body>
</html>
