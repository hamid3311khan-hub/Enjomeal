<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><title>Menu - Eat4Bite™</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
.header{background:#ff6600;color:#fff;padding:15px;position:sticky;top:0}
.item{background:#fff;margin:10px;padding:15px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.add-btn{background:#4caf50;color:#fff;border:none;padding:8px 15px;border-radius:20px;cursor:pointer;font-weight:bold}
.cart-float{position:fixed;bottom:20px;right:20px;background:#ff6600;color:#fff;padding:15px 25px;border-radius:50px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="header"><h2 id="restName">Loading...</h2></div>
<div id="menu"></div>
<div class="cart-float" onclick="location.href='/cart.html'">🛒 Cart (<span id="cartCount">0</span>)</div>
<script>
const API="/api"; const restId=new URLSearchParams(location.search).get('id');
function updateCartCount(){document.getElementById('cartCount').innerText=JSON.parse(localStorage.getItem('cart')||'[]').length}
updateCartCount();
fetch(`${API}/menu/${restId}`).then(r=>r.json()).then(data=>{
document.getElementById('restName').innerText=data.restaurantName;
document.getElementById('menu').innerHTML=data.items.map(i=>`
<div class="item"><div><b>${i.name}</b><br>₹${i.price}</div>
<button class="add-btn" onclick="addToCart('${i.name}',${i.price},'${i._id}')">ADD +</button></div>`).join('')});
function addToCart(name,price,id){let cart=JSON.parse(localStorage.getItem('cart')||'[]');cart.push({name,price,id,restaurantId:restId});localStorage.setItem('cart',JSON.stringify(cart));updateCartCount();alert(name+" added")}
</script>
</body></html>
