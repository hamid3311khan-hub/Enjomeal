<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><title>Cart</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial;background:#f5f5f5;padding:10px}.box{background:#fff;padding:15px;border-radius:8px;margin:10px 0}</style>
</head><body>
<h2>🛒 Your Cart</h2>
<div id="cartItems" class="box"></div>
<button onclick="location.href='/payment.html'" style="width:100%;padding:12px;background:#ff6600;color:#fff;border:none">Proceed to Payment</button>
<script>
let cart=JSON.parse(localStorage.getItem('cart')||'[]');
document.getElementById('cartItems').innerHTML=cart.map(i=>`<p>${i.name} - ₹${i.price}</p>`).join('') + `<h3>Total: ₹${cart.reduce((a,b)=>a+b.price,0)}</h3>`;
</script></body></html>
