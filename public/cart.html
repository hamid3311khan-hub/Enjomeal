<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cart - Eat4Bite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial; background:#f5f5f5; padding:10px}
.header{background:#4caf50; color:#fff; padding:15px; border-radius:8px}
.box{background:#fff; padding:15px; margin:10px 0; border-radius:8px}
.item{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #eee}
input,textarea{width:100%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px}
.btn{width:100%; padding:15px; background:#ff9800; color:#fff; border:none; border-radius:8px; font-size:18px; font-weight:bold; cursor:pointer}
.total{font-size:20px; font-weight:bold; text-align:right}
</style>
</head>
<body>

<div class="header">
  <h2>🛒 Your Cart</h2>
  <a href="/" style="color:#fff">← Continue Shopping</a>
</div>

<div class="box">
  <div id="cartItems">Your cart is empty</div>
  <h3 class="total">Total: ₹<span id="grandTotal">0</span></h3>
</div>

<div class="box">
  <h3>Delivery Details</h3>
  <input type="text" id="name" placeholder="Your Name">
  <input type="tel" id="phone" placeholder="Phone Number">
  <textarea id="address" placeholder="Full Delivery Address"></textarea>
  <select id="payment" style="width:100%; padding:10px">
    <option value="COD">Cash on Delivery</option>
    <option value="Online">Pay Online</option>
  </select>
</div>

<button class="btn" onclick="placeOrder()">Place Order</button>

<script>
const API = "/api";
let cart = JSON.parse(localStorage.getItem('cart')) || [];
loadCart();

function loadCart(){
  if(cart.length === 0){
    document.getElementById('cartItems').innerHTML = "Your cart is empty";
    return;
  }
  
  let total = 0;
  document.getElementById('cartItems').innerHTML = cart.map((item, index) => {
    total += item.price * item.qty;
    return `
      <div class="item">
        <div>
          <b>${item.name}</b> x ${item.qty}<br>
          <small>₹${item.price} each</small>
        </div>
        <div>
          ₹${item.price * item.qty}
          <button onclick="removeItem(${index})" style="margin-left:10px">❌</button>
        </div>
      </div>
    `
  }).join('');
  
  document.getElementById('grandTotal').innerText = total;
}

function removeItem(index){
  cart.splice(index,1);
  localStorage.setItem('cart', JSON.stringify(cart));
  location.reload();
}

async function placeOrder(){
  if(cart.length === 0) return alert("Cart is empty");
  
  let orderData = {
    name: document.getElementById('name').value,
    phone: document.getElementById('phone').value,
    address: document.getElementById('address').value,
    paymentMode: document.getElementById('payment').value,
    items: cart,
    grand_total: document.getElementById('grandTotal').innerText,
    restaurantId: cart[0].restaurantId // pehle item ka restaurant
  }
  
  if(!orderData.name || !orderData.phone || !orderData.address) return alert("Fill all details");
  
  let res = await fetch(`${API}/orders`, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(orderData)
  });
  
  let data = await res.json();
  localStorage.removeItem('cart');
  alert("Order Placed! ID: " + data.trackId);
  window.location = `/track.html?trackId=${data.trackId}`;
}
</script>
</body>
</html>
