<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Restaurant Registration - Eat4Bite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial; background:#f5f5f5; padding:20px}
.form{background:#fff; padding:20px; border-radius:10px; max-width:500px; margin:auto; box-shadow:0 2px 10px #ccc}
input,textarea{width:95%; padding:10px; margin:8px 0; border:1px solid #ddd; border-radius:5px}
.btn{background:#4caf50; color:#fff; padding:12px; border:none; border-radius:5px; width:100%; font-size:16px; cursor:pointer}
.btn:hover{background:#45a049}
h2{color:#4caf50; text-align:center}
.note{font-size:12px; color:#777; text-align:center}
</style>
</head>
<body>

<div class="form">
  <h2>🏪 Restaurant Registration</h2>
  <p class="note">Registration Fee: ₹200 One Time. Status: Trial 30 Days</p>

  <input type="text" id="restaurantName" placeholder="Restaurant Name" required>
  <input type="tel" id="mobile" placeholder="10 Digit Mobile" required>
  <textarea id="address" placeholder="Full Address with Pincode" required></textarea>
  <input type="password" id="password" placeholder="Create Password" required>
  <input type="file" id="image" accept="image/*">

  <button class="btn" onclick="registerRestaurant()">Register & Pay ₹200</button>
  <p style="text-align:center">Already have account? <a href="/restaurant-login">Login</a></p>
</div>

<script>
const API = "/api";

async function registerRestaurant(){
  const formData = new FormData();
  
  // Backend ke hisaab se naam
  formData.append('name', document.getElementById('restaurantName').value);
  formData.append('phone', document.getElementById('mobile').value);
  formData.append('address', document.getElementById('address').value);
  formData.append('password', document.getElementById('password').value);
  
  const imageFile = document.getElementById('image').files[0];
  if(imageFile) formData.append('image', imageFile);

  try {
    let res = await fetch(`${API}/restaurant/register`, {method:'POST', body:formData});
    let data = await res.json();

    if(res.ok){
      alert('Registration Success! ✅ ID: ' + data.restaurantId);
      window.location = '/restaurant-login';
    } else {
      alert(data.error || 'Registration Failed');
    }
  } catch (err) {
    alert('Server Error: ' + err.message);
  }
}
</script>
</body>
</html>
