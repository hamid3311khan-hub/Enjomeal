<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><title>Restaurant Register</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{background:#f5f5f5}.card{background:#fff;padding:20px;max-width:400px;margin:50px auto;border-radius:10px}input{width:95%;padding:10px;margin:8px 0}</style></head><body>
<div class="card"><h2>🏪 Restaurant Registration</h2>
<input id="name" placeholder="Restaurant Name">
<input id="phone" placeholder="Phone">
<input id="address" placeholder="Address">
<input id="pass" type="password" placeholder="Password">
<input id="image" type="file">
<button onclick="register()" style="width:100%;padding:12px;background:#ff6600;color:#fff;border:none">Register</button>
<p>Already have account? <a href="/restaurant-login.html">Login</a></p></div>
<script>
const API="/api";
async function register(){
  let fd=new FormData(); fd.append('restaurantName',name.value); fd.append('phone',phone.value); fd.append('address',address.value); fd.append('password',pass.value); fd.append('image',image.files[0]);
  let res=await fetch(`${API}/restaurant/register`,{method:'POST',body:fd}); let data=await res.json();
  if(data.success){alert("Registered. Waiting for Admin Approval"); location.href='/restaurant-login.html'}
}
</script></body></html>
