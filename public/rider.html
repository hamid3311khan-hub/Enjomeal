<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rider Dashboard - Eat4Bite</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { font-family: Arial; margin: 0; padding: 10px; background: #f5f5f5; }
  #map { height: 250px; border-radius: 10px; margin-bottom: 10px; }
  #orders { background: white; padding: 10px; border-radius: 10px; }
  .order-card { border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 8px; background: #fff9e6; }
  .btn { background: #ff5722; color: white; padding: 8px 12px; border: none; border-radius: 5px; margin: 5px; }
</style>
</head>
<body>

<h2>🚴 Rider Dashboard</h2>
<div id="map"></div>
<div id="orders">
  <h3>New Orders <span id="orderCount">0</span></h3>
  <div id="orderList">Waiting for orders...</div>
</div>

<audio id="dingSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getDatabase, ref, onChildAdded, set } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAKROA-L-VckdWj5_lqDpj_HUIjzOIHDKo",
    authDomain: "eat4bite.firebaseapp.com",
    databaseURL: "https://eat4bite-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "eat4bite",
    storageBucket: "eat4bite.firebasestorage.app",
    messagingSenderId: "544422285835",
    appId: "1:544422285835:web:fecb23720927bebf3aad0e",
    measurementId: "G-QF5RVQ33FQ"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  
  const riderData = JSON.parse(localStorage.getItem('riderData') || '{}');
  const riderMobile = riderData.mobile;
  const API = "https://eat4bite.onrender.com";

  // 1. MAP
  const map = L.map('map').setView([26.123, 84.456], 13); // Areraj ka lat lng daal de
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  let riderMarker;

  // 2. LIVE LOCATION UPDATE
  function sendLocation(lat, lng) {
    fetch(`${API}/riderLocation`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({mobile: riderMobile, lat, lng})
    });
    if(riderMarker) riderMarker.setLatLng([lat,lng]);
    else riderMarker = L.marker([lat,lng]).addTo(map).bindPopup("You");
    map.setView([lat,lng]);
  }
  navigator.geolocation.watchPosition(p => sendLocation(p.coords.latitude, p.coords.longitude), null, {enableHighAccuracy: true});

  // 3. NEW ORDER SUNNA - FIREBASE
  const ordersRef = ref(db, 'rider_orders/' + riderMobile);
  let orderCount = 0;
  
  onChildAdded(ordersRef, (snapshot) => {
    const order = snapshot.val();
    order.id = snapshot.key;
    document.getElementById('dingSound').play(); // TING SOUND
    
    orderCount++;
    document.getElementById('orderCount').innerText = orderCount;
    
    const div = document.createElement('div');
    div.className = 'order-card';
    div.innerHTML = `
      <b>Order #${order.id}</b><br>
      Customer: ${order.customerName}<br>
      Address: ${order.address}<br>
      Amount: ₹${order.total}<br>
      <button class="btn" onclick="acceptOrder('${order.id}')">Accept</button>
      <button class="btn" onclick="window.open('https://www.google.com/maps/search/?api=1&query=${order.custLat},${order.custLng}')">Get Directions</button>
    `;
    document.getElementById('orderList').prepend(div);
  });

  function acceptOrder(orderId) {
    alert('Order Accepted: ' + orderId);
    // Yaha API call karke status update karna hai
  }
  window.acceptOrder = acceptOrder;

</script>
</body>
</html>
