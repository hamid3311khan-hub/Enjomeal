<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rider Panel - Eat4Bite™</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body{background:#f8f9fa}
    .navbar-brand{color:#ff6600!important; font-weight:bold}
    .order-card{border-left:5px solid #ffc107; transition:0.3s}
    .order-card.new{border-left-color:#28a745; animation:blink 1.5s infinite}
    @keyframes blink {50%{background:#d4edda;}}
    .map-box{border-radius:8px; overflow:hidden; margin-top:8px;}
    .cash-box{background:#fff3cd; border:1px solid #ffc107; border-radius:10px; padding:15px}
</style>
</head>
<body>

<nav class="navbar bg-white shadow-sm px-3">
    <a class="navbar-brand">🏍️ <span id="riderName">Rider</span> Panel</a>
    <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
</nav>

<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <div class="card shadow-sm p-3">
                <h5>📦 New Orders Near You</h5>
                <audio id="notifSound" src="https://cdn.freesound.org/previews/270/270404_5123851-lq.mp3"></audio>
                <div id="ordersList">Login karne ke baad orders dikhenge</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm p-3 cash-box">
                <h5>💰 My Earnings</h5>
                <h3>₹<span id="cashBalance">0</span></h3>
                <small class="text-muted">COD Collection. Restaurant me jama karein</small>
                <hr>
                <h6>Cash Deposit Karein</h6>
                <input type="number" id="depositAmount" class="form-control mb-2" placeholder="Amount">
                <button class="btn btn-warning w-100" onclick="depositCash()">Deposit Request</button>
            </div>
            <div class="card shadow-sm p-3 mt-3">
                <h6>Live Location</h6>
                <button class="btn btn-sm btn-success w-100" onclick="startTracking()">📍 Start Sharing Location</button>
                <p class="small text-muted mt-2" id="locationStatus">Location Off</p>
            </div>
        </div>
    </div>
</div>

<!-- Login Modal -->
<div class="modal fade" id="loginModal" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5>Rider Login</h5></div>
      <div class="modal-body">
        <form id="riderLoginForm">
            <input type="tel" name="mobile" class="form-control mb-2" placeholder="Mobile" required>
            <input type="password" name="password" class="form-control mb-2" placeholder="Password" required>
            <button class="btn btn-warning w-100">Login</button>
        </form>
        <p class="text-center mt-2">Naye ho? <a href="/rider-register">Register</a></p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
const API = window.location.origin;
const socket = io();
let riderData = JSON.parse(localStorage.getItem('riderData') || '{}');
let watchId = null;

const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));

// 1. CHECK LOGIN
if(!riderData._id){
    loginModal.show();
} else {
    document.getElementById('riderName').innerText = riderData.name;
    loadOrders();
    loadCash();
}

document.getElementById('riderLoginForm').addEventListener('submit', async(e)=>{
    e.preventDefault();
    const formData = new FormData(e.target);
    const res = await fetch(`${API}/api/rider-login`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(Object.fromEntries(formData))});
    const result = await res.json();
    if(result.success){
        localStorage.setItem('riderData', JSON.stringify(result.rider));
        riderData = result.rider;
        loginModal.hide();
        document.getElementById('riderName').innerText = riderData.name;
        loadOrders(); loadCash();
    } else { alert(result.error); }
});

function logout(){ localStorage.removeItem('riderData'); location.reload(); }

// 2. LOAD ORDERS
async function loadOrders(){
    const res = await fetch(`${API}/api/orders?status=Ready for Pickup`);
    const orders = await res.json();
    if(orders.length > 0 && document.getElementById('ordersList').innerHTML.includes('Login')) {
        document.getElementById('notifSound').play().catch(()=>{});
    }
    let html = '';
    if(orders.length === 0) html = '<p class="text-muted text-center">Abhi koi naya order nahi</p>';
    orders.forEach(o=>{
        const map = o.custLat ? `<iframe src="https://www.google.com/maps?q=${o.custLat},${o.custLng}&z=15&output=embed" width="100%" height="180" class="map-box" loading="lazy"></iframe>` : '';
        html += `
        <div class="card order-card p-3 mb-2 ${o.status=='Ready for Pickup'?'new':''}">
            <div class="d-flex justify-content-between">
                <h6><b>${o.trackId}</b> - ₹${o.grand_total}</h6>
                <span class="badge bg-warning text-dark">${o.paymentMode}</span>
            </div>
            <p class="mb-1"><b>Customer:</b> ${o.name} - ${o.phone}</p>
            <p class="mb-1"><b>Address:</b> ${o.address}</p>
            ${map}
            <button class="btn btn-success btn-sm w-100 mt-2" onclick="acceptOrder('${o._id}')">✅ Accept & Pickup</button>
        </div>`;
    });
    document.getElementById('ordersList').innerHTML = html;
}

// 3. ACCEPT ORDER
async function acceptOrder(orderId){
    const res = await fetch(`${API}/api/rider/accept-order`, {
        method:'POST', 
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({orderId, riderId:riderData._id, riderName:riderData.name, riderMobile:riderData.mobile})
    });
    const result = await res.json();
    if(result.success){
        alert('Order Accepted!');
        window.location.href = `/order-details?id=${result.order.trackId}`; // Rider tracking page pe
    } else { alert(result.error); }
}

// 4. CASH & LOCATION
async function loadCash(){
    document.getElementById('cashBalance').innerText = riderData.cash_balance || 0;
}

async function depositCash(){
    const amount = document.getElementById('depositAmount').value;
    if(!amount) return alert('Amount daalo');
    const res = await fetch(`${API}/api/rider/deposit-cash`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({riderId:riderData._id, amount})});
    const result = await res.json(); alert(result.msg); loadCash();
}

function startTracking(){
    if(!navigator.geolocation) return alert('GPS not supported');
    document.getElementById('locationStatus').innerText = 'Location ON - Sharing...';
    watchId = navigator.geolocation.watchPosition((pos)=>{
        socket.emit('riderLocation', {riderId: riderData._id, lat: pos.coords.latitude, lng: pos.coords.longitude});
    });
}
</script>
</body>
</html>
